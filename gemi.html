<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ΓΕΜΗ | Πρακτική · Επιμελητήριο Έβρου</title><style>:root {
  --paper: #f3efe6;
  --card: #fffdf8;
  --ink: #1a1e1c;
  --muted: #5c615c;
  --line: #d4cbbd;
  --teal: #0f3d38;
  --teal-2: #1c5c55;
  --soft: #e4eeeb;
  --clay: #8c3a2b;
  --gold: #8a7040;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.55 "Segoe UI", "Helvetica Neue", sans-serif;
}
a { color: var(--teal); }
button, input, select, textarea { font: inherit; color: inherit; }
.skip {
  position: absolute; left: -999px; top: 0;
}
.skip:focus { left: 1rem; top: 1rem; background: #fff; padding: .4rem .6rem; z-index: 9; }
.wrap { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
.topbar {
  background: var(--ink);
  color: #f3efe6;
  border-bottom: 4px double var(--gold);
}
.brandrow {
  display: flex; justify-content: space-between; gap: 1rem; align-items: flex-end;
  padding: .9rem 0 .7rem;
}
.brandrow a { color: #f3efe6; }
.kicker { margin: 0; letter-spacing: .14em; text-transform: uppercase; font-size: .72rem; color: #b7d4cf; font-weight: 700; }
h1, h2, h3, .display { font-family: Georgia, "Times New Roman", serif; font-weight: 600; }
.mark { margin: .1rem 0 0; font-size: 1.7rem; line-height: 1; }
.tagline { margin: .2rem 0 0; color: #e7e1d6; font-size: .95rem; }
.nav { display: flex; flex-wrap: wrap; gap: .35rem; padding-bottom: .85rem; }
.nav a, .chip, .btn {
  display: inline-flex; align-items: center; justify-content: center;
  text-decoration: none; border: 1px solid #3c4441; color: #f3efe6;
  padding: .35rem .65rem; background: transparent; cursor: pointer;
}
.nav a[aria-current="page"], .chip[aria-pressed="true"], .btn.primary {
  background: var(--teal-2); border-color: var(--teal-2); color: #fff;
}
.chip, .btn.dark {
  color: var(--ink); border-color: var(--ink); background: var(--card);
}
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.clay { background: var(--clay); border-color: var(--clay); color: #fff; }
main { padding: 1.25rem 0 5.5rem; }
.searchbox, .panel, .card, .callout, .result {
  background: var(--card);
  border: 1px solid var(--ink);
}
.searchbox { padding: 1.1rem 1.15rem 1.2rem; }
.searchbox h1 { font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.12; margin: .2rem 0 .7rem; }
.searchrow { display: flex; gap: .5rem; }
.searchrow input[type="search"], .field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--ink); background: #fff; padding: .65rem .7rem;
}
.grid { display: grid; gap: .75rem; }
.tools { grid-template-columns: repeat(5, 1fr); margin-top: .9rem; }
.cards3 { grid-template-columns: repeat(3, 1fr); }
.cards2 { grid-template-columns: 1.2fr .8fr; }
.tool, .mini {
  display: block; text-decoration: none; color: inherit; background: var(--card);
  border: 1px solid var(--line); padding: .75rem .8rem;
}
.tool:hover, .mini:hover, .nav a:hover, .chip:hover { border-color: var(--teal); }
.tool strong, .mini strong { display: block; font-family: Georgia, serif; font-size: 1.05rem; }
.muted { color: var(--muted); }
.small { font-size: .92rem; }
.section { margin-top: 1.4rem; }
.section h2 { font-size: 1.45rem; margin: 0 0 .6rem; }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.list a, .list .row {
  display: grid; grid-template-columns: 7.2rem 6.5rem 1fr auto; gap: .6rem;
  padding: .7rem 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; align-items: baseline;
}
dl.rows { margin: 0; }
dl.rows > div { display: grid; grid-template-columns: 16rem 1fr; gap: .6rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
dt { font-weight: 700; }
dd { margin: 0; }
.badge { display: inline-block; border: 1px solid var(--line); padding: .05rem .4rem; font-size: .78rem; letter-spacing: .03em; }
.badge.law { background: #efe4c8; }
.badge.reg { background: #d9e6ea; }
.badge.note { background: var(--soft); }
.callout { padding: .85rem 1rem; border-left: 4px solid var(--teal); background: var(--soft); }
.callout.warn { border-left-color: var(--clay); background: #f6ebe6; }
.crumbs { font-size: .92rem; margin: 0 0 .4rem; }
.hero-card { padding: 1rem 1.1rem; }
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { display: grid; grid-template-columns: 1fr auto; gap: .6rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid var(--line); }
.check-actions { display: flex; gap: .3rem; }
.check-actions button[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
.progress { font-weight: 700; }
pre.clause { white-space: pre-wrap; background: #f7f3ea; border: 1px solid var(--line); padding: .8rem; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; vertical-align: top; padding: .45rem .5rem; border-bottom: 1px solid var(--line); }
.table-wrap { overflow: auto; border: 1px solid var(--ink); background: #fff; }
footer.site { border-top: 1px solid var(--line); padding: 1rem 0 1.4rem; color: var(--muted); font-size: .92rem; }
.bottom {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); z-index: 5;
}
.bottom a { flex: 1; text-align: center; color: #f3efe6; text-decoration: none; padding: .65rem .2rem; font-size: .78rem; }
.filters { display: flex; flex-wrap: wrap; gap: .4rem; margin: .4rem 0 .8rem; }
.options { display: flex; flex-direction: column; gap: .45rem; margin-top: .7rem; }
.options a { text-decoration: none; color: inherit; border: 1px solid var(--ink); background: #fff; padding: .7rem .8rem; }
.options a:hover { background: var(--soft); }
.field { display: flex; flex-direction: column; gap: .25rem; margin-bottom: .7rem; }
.field label { font-weight: 700; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.wrong, .right { padding: .7rem .8rem; }
.wrong { background: #f6ebe6; }
.right { background: var(--soft); }
@media (max-width: 860px) {
  .tools, .cards3, .cards2, .split, dl.rows > div, .list a, .list .row { grid-template-columns: 1fr; }
  .searchrow { flex-direction: column; }
  .bottom { display: flex; }
  .brandrow { align-items: flex-start; flex-direction: column; }
}
@media print {
  .no-print, .bottom, .topbar, footer.site { display: none !important; }
  body { background: #fff; }
  .panel, .card, .searchbox { border-color: #000; }
}
</style></head>

<script>const DATA = {"brand":{"mark":"ΓΕΜΗ | Πρακτική","line":"Από τη νομοθεσία στην εφαρμογή.","chamber":"Επιμελητήριο Έβρου","unit":"Τμήμα Γ.Ε.ΜΗ. Επιμελητηρίου Έβρου","version":"2.0","checked":"04.10.2026"},"forms":[{"id":"ae","short":"Α.Ε.","long":"Ανώνυμη εταιρεία"},{"id":"epe","short":"Ε.Π.Ε.","long":"Εταιρεία περιορισμένης ευθύνης"},{"id":"ike","short":"Ι.Κ.Ε.","long":"Ιδιωτική κεφαλαιουχική εταιρεία"},{"id":"oe","short":"Ο.Ε.","long":"Ομόρρυθμη εταιρεία"},{"id":"ee","short":"Ε.Ε.","long":"Ετερόρρυθμη εταιρεία"},{"id":"synetairismos","short":"Συνεταιρισμός","long":"Αστικός συνεταιρισμός"},{"id":"ypokatastima","short":"Υποκατάστημα","long":"Υποκατάστημα αλλοδαπής"},{"id":"astiki","short":"Αστική","long":"Αστική εταιρεία με οικονομικό σκοπό"}],"groups":[{"id":"tautotita","label":"Σύσταση και ταυτότητα"},{"id":"leitourgia","label":"Λειτουργία και εταιρικές μεταβολές"},{"id":"logistiki","label":"Οικονομικές καταστάσεις"},{"id":"telos","label":"Λύση, εκκαθάριση, διαγραφή"},{"id":"schema","label":"Μετασχηματισμοί και υποκατάστημα"}],"acts":[{"id":"systasi","title":"Σύσταση","group":"tautotita","forms":["ae","epe","ike","oe","ee","synetairismos"],"channel":"Ηλεκτρονική Υπηρεσία Μίας Στάσης, όπου η μορφή το επιτρέπει. Αλλιώς, αίτηση στην Υπηρεσία Γ.Ε.ΜΗ. της έδρας.","trigger":"Υπογραφή καταστατικού ή συμφωνητικού.","deadline":"Όπου η καταχώριση είναι συστατική, η εταιρεία δεν έχει νομική προσωπικότητα πριν από αυτήν. Η έναρξη στη ΔΟΥ δεν την υποκαθιστά.","documents":[{"id":"statute","label":"Καταστατικό ή ιδιωτικό συμφωνητικό, με σκοπό, έδρα, διάρκεια και κεφάλαιο"},{"id":"founders","label":"Στοιχεία ιδρυτών: ταυτότητα και ΑΦΜ"},{"id":"admin","label":"Διορισμός διοίκησης και ρητός τρόπος εκπροσώπησης","hint":"Όχι μόνο ονόματα."},{"id":"name","label":"Δέσμευση επωνυμίας και, αν υπάρχει, διακριτικού τίτλου"},{"id":"capital","label":"Μνεία κεφαλαίου και της καταβολής του, όπου απαιτείται"}],"blockers":["Η επωνυμία έχει ήδη δεσμευθεί από άλλον.","Ο σκοπός είναι τόσο γενικός ώστε να μην ελέγχεται.","Λείπει ο τρόπος με τον οποίο δεσμεύεται η εταιρεία."],"ifOmitted":"Χωρίς καταχώριση δεν υπάρχει, όπου ο νόμος το ορίζει, νομικό πρόσωπο. Σφάλμα της ηλεκτρονικής σύστασης διορθώνεται με αίτηση· δεν θεραπεύεται με δεύτερη σύσταση.","sanction":"Άρθρο 4 της ΚΥΑ, ορισμένα ποσά και όχι εύρος: Α.Ε. 5.000 €, Ι.Κ.Ε., Ε.Π.Ε. και συνεταιρισμός 2.000 €, Ο.Ε., Ε.Ε. και αστική 500 €. Παράλειψη εγγραφής, άρθρο 5, για μερίδα Επιμελητηρίου: Α.Ε. 2.000 €, Ε.Π.Ε., Ι.Κ.Ε., συνεταιρισμός και υποκατάστημα 1.200 €, Ο.Ε. και Ε.Ε. 1.000 €.","suspension":false,"basis":["Άρθρο 16 ν. 4919/2022","ΚΥΑ 46982/2025, άρθρα 4 και 5"],"special":{"ae":"Σύσταση με συμβολαιογραφικό έγγραφο ή με ιδιωτικό έγγραφο, αν υιοθετείται πρότυπο καταστατικό. Το έγγραφο είναι συμβολαιογραφικό και όταν εισφέρεται στοιχείο για το οποίο ο νόμος απαιτεί αυτόν τον τύπο, ιδίως ακίνητο (άρθρο 4 παρ. 2 ν. 4548/2018). Ελάχιστο κεφάλαιο 25.000 ευρώ, ολοσχερώς καταβεβλημένο κατά τη σύσταση (άρθρο 15).","epe":"Σύσταση με συμβολαιογραφικό έγγραφο ή, χωρίς καμία παρέκκλιση, με πρότυπο καταστατικό (άρθρο 6 ν. 3190/1955, όπως ισχύει). Αν εισφέρεται στοιχείο για τη μεταβίβαση του οποίου απαιτείται συμβολαιογραφικός τύπος, δεν αρκεί απλό ιδιωτικό έγγραφο. Κάθε μεταγενέστερη τροποποίηση παραμένει συμβολαιογραφική.","ike":"Η εταιρική σύμβαση καταρτίζεται εγγράφως. Συμβολαιογραφικός τύπος απαιτείται όταν τον επιβάλλει ειδική διάταξη, όταν εισφέρεται στοιχείο για το οποίο ο νόμος τον απαιτεί, ή όταν τον επιλέγουν τα μέρη (άρθρο 43 ν. 4072/2012). Οι εισφορές διακρίνονται σε κεφαλαιακές, εξωκεφαλαιακές και εγγυητικές.","oe":"Ιδιωτικό συμφωνητικό, εκτός αν εισφέρεται στοιχείο που απαιτεί συμβολαιογραφικό τύπο. Η καταχώριση στο Γ.Ε.ΜΗ. είναι συστατική.","ee":"Όπως στην ομόρρυθμη. Στο συμφωνητικό διακρίνεται ποιος είναι ομόρρυθμος και ποιος ετερόρρυθμος, και έως ποιου ποσού ευθύνεται ο ετερόρρυθμος.","synetairismos":"Καταστατικό κατά την ειδική νομοθεσία του συνεταιρισμού και καταχώριση στο Γ.Ε.ΜΗ. Δεν αντιγράφεται το κεφάλαιο της ανώνυμης."}},{"id":"eponymia","title":"Επωνυμία και διακριτικός τίτλος","group":"tautotita","forms":["ae","epe","ike","oe","ee","synetairismos","ypokatastima"],"channel":"Δέσμευση στο μητρώο επωνυμιών: αυτόματη, με προέλεγχο ή με προδέσμευση. Η μεταβολή καταστατικού ακολουθεί στην Υπηρεσία.","trigger":"Απόφαση του αρμόδιου οργάνου ή, στη σύσταση, η αίτηση δέσμευσης.","deadline":"Η αίτηση μεταβολής υποβάλλεται εντός είκοσι ημερών από την απόφαση. Η δέσμευση προηγείται της χρήσης του νέου διακριτικού.","deadlineDays":20,"documents":[{"id":"decision","label":"Απόφαση τροποποίησης επωνυμίας ή διακριτικού τίτλου"},{"id":"coded","label":"Κωδικοποιημένο καταστατικό, αν η επωνυμία είναι μέρος του"},{"id":"reservation","label":"Αποτέλεσμα δέσμευσης ή προδέσμευσης"}],"blockers":["Ταυτόσημη ή παραπλανητικά όμοια προγενέστερη δέσμευση.","Ο διακριτικός τίτλος χρησιμοποιείται στα έγγραφα πριν καταχωριστεί."],"ifOmitted":"Η καταχώριση έχει δηλωτικό χαρακτήρα και αποδεικνύει τον δικαιούχο με χρονική προτεραιότητα, σε όλη την επικράτεια. Δεν είναι σήμα.","sanction":"Άρθρο 11, μερίδα Επιμελητηρίου: κεφαλαιουχική κατά μέγεθος 1.600, 800, 400 ή 320 €, συνεταιρισμός και υποκατάστημα 320 €, Ο.Ε., Ε.Ε. και αστική 200 €. Δεν είναι εύρος 200 έως 2.000.","suspension":false,"basis":["Άρθρο 53 ν. 4919/2022","ΚΥΑ 46982/2025, άρθρο 11"],"clauses":[{"id":"name-clause","title":"Διατύπωση μεταβολής επωνυμίας","text":"Η εταιρεία αποφασίζει την τροποποίηση της επωνυμίας της από «…» σε «…», με διακριτικό τίτλο «…». Η τροποποίηση ισχύει έναντι τρίτων από την καταχώρισή της στο Γ.Ε.ΜΗ. Εξουσιοδοτείται ο νόμιμος εκπρόσωπος να υποβάλει την αίτηση και να αποδεχθεί διορθώσεις τυπικού χαρακτήρα που δεν αλλοιώνουν την απόφαση."}]},{"id":"katastatiko","title":"Τροποποίηση καταστατικού","group":"leitourgia","forms":["ae","epe","ike","oe","ee","synetairismos"],"channel":"Αίτηση στην Υπηρεσία Γ.Ε.ΜΗ. της έδρας, με έλεγχο νομιμότητας.","trigger":"Ημερομηνία της απόφασης του οργάνου που έχει την αρμοδιότητα κατά το καταστατικό και τον νόμο.","deadline":"Υποβολή εντός είκοσι ημερών από την απόφαση. Η τροποποίηση που δεν καταχωρίστηκε δεν αντιτάσσεται στους τρίτους.","deadlineDays":20,"documents":[{"id":"minutes","label":"Πρακτικό, με τόπο, ημερομηνία, ώρα και απαρτία ή πλειοψηφία"},{"id":"text","label":"Το νέο κείμενο των άρθρων που αλλάζουν, αυτολεξεί"},{"id":"coded","label":"Κωδικοποιημένο καταστατικό"},{"id":"sign","label":"Υπογραφές όσων το πρακτικό δηλώνει ότι υπέγραψαν, αυθημερόν"}],"blockers":["Η απόφαση ελήφθη από όργανο που δεν είχε την αρμοδιότητα.","Το πρακτικό και το κωδικοποιημένο καταστατικό λένε διαφορετικά πράγματα.","Η μερίδα τελεί σε αναστολή καταχώρισης."],"ifOmitted":"Η τροποποίηση δεν έχει επέλθει έναντι των τρίτων. Εκπρόθεσμη αίτηση επισύρει κύρωση, χωριστά από το κύρος της απόφασης.","sanction":"Εκπρόθεσμη αίτηση, άρθρο 7, μερίδα Επιμελητηρίου: Α.Ε. 200 €, Ε.Π.Ε., Ι.Κ.Ε. και συνεταιρισμός 120 €, Ο.Ε., Ε.Ε. και αστική 100 €. Παράλειψη της πράξης, άρθρο 9: κεφαλαιουχική 1.600 / 800 / 400 / 320 € κατά μέγεθος, Ο.Ε., Ε.Ε. και αστική 200 €.","suspension":false,"basis":["Άρθρο 25 ν. 4919/2022","ΚΥΑ 46982/2025, άρθρα 7 και 9"],"special":{"ae":"Η τροποποίηση αποφασίζεται από τη γενική συνέλευση, ή από το διοικητικό συμβούλιο μόνο όπου ο ν. 4548/2018 το λέει ρητά. Δεν απαιτεί συμβολαιογραφικό έγγραφο (άρθρο 4 παρ. 3). Το κωδικοποιημένο κείμενο το υπογράφει ο πρόεδρος του διοικητικού συμβουλίου. Συμβολαιογραφικό χρειάζεται η σύσταση, εκτός αν υιοθετείται πρότυπο καταστατικό, και κάθε εισφορά στοιχείου για το οποίο ο νόμος απαιτεί συμβολαιογραφικό τύπο, ιδίως ακινήτου (άρθρο 4 παρ. 2).","epe":"Κάθε τροποποίηση της εταιρικής σύμβασης γίνεται υποχρεωτικά με συμβολαιογραφικό έγγραφο και με αυξημένη πλειοψηφία: περισσότεροι από τους μισούς εταίρους, που εκπροσωπούν τουλάχιστον το 65% του κεφαλαίου (άρθρο 38 ν. 3190/1955, όπως ισχύει). Ιδιωτικό πρακτικό δεν αρκεί. Δεν ισχύει η ευχέρεια της ανώνυμης και της ιδιωτικής κεφαλαιουχικής.","ike":"Ιδιωτικό έγγραφο. Συμβολαιογράφος χρειάζεται μόνο αν εισφέρεται στοιχείο για το οποίο ο νόμος απαιτεί συμβολαιογραφικό τύπο, ιδίως ακίνητο. Στο καταστατικό διακρίνονται η κεφαλαιακή, η εξωκεφαλαιακή και η εγγυητική εισφορά.","oe":"Τροποποίηση της εταιρικής σύμβασης με ιδιωτικό έγγραφο, κατά τη συμφωνία των εταίρων. Δεν απαιτείται συμβολαιογράφος, εκτός αν εισφέρεται στοιχείο που ο νόμος το επιβάλλει.","ee":"Όπως στην ομόρρυθμη: ιδιωτικό έγγραφο. Ο ετερόρρυθμος δεν διαχειρίζεται και ευθύνεται έως την εισφορά του.","synetairismos":"Απόφαση της γενικής συνέλευσης κατά τον νόμο του συνεταιρισμού και το καταστατικό. Δεν αντιγράφεται ο τύπος της ανώνυμης ή της εταιρείας περιορισμένης ευθύνης."}},{"id":"edra","title":"Μεταβολή έδρας","group":"leitourgia","forms":["ae","epe","ike","oe","ee","synetairismos","ypokatastima"],"channel":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας. Αν αλλάζει νομός, η αρμοδιότητα ακολουθεί τη νέα έδρα: μετέχουν η υπηρεσία αποχώρησης και η υπηρεσία άφιξης.","trigger":"Ημερομηνία της απόφασης μεταφοράς.","deadline":"Υποβολή εντός είκοσι ημερών. Η νέα διεύθυνση χρησιμοποιείται στα εταιρικά έγγραφα από την καταχώριση.","deadlineDays":20,"documents":[{"id":"decision","label":"Απόφαση με την πλήρη νέα διεύθυνση: οδό, αριθμό, τ.κ., δήμο"},{"id":"statute","label":"Τροποποίηση του άρθρου της έδρας και κωδικοποίηση"},{"id":"use","label":"Στοιχεία χρήσης του ακινήτου, αν ζητηθούν για τον έλεγχο της διεύθυνσης"}],"blockers":["Η διεύθυνση είναι ταχυδρομική θυρίδα ή αόριστη («πόλη Αλεξανδρούπολη»).","Η αίτηση υποβλήθηκε μόνο στο επιμελητήριο αποχώρησης, ενώ άλλαξε ο νομός."],"ifOmitted":"Η έδρα που εμφανίζει η μερίδα παραμένει η παλαιά. Πιστοποιητικά, κοινοποιήσεις και αρμοδιότητα υπηρεσίας ακολουθούν τη μερίδα, όχι την πινακίδα.","sanction":"Εκπρόθεσμη αίτηση, άρθρο 7, μερίδα Επιμελητηρίου: Α.Ε. 200 €, Ε.Π.Ε. και Ι.Κ.Ε. 120 €, Ο.Ε., Ε.Ε. και αστική 100 €. Παράλειψη της πράξης, άρθρο 9: κατά μέγεθος ή κατά μορφή, όπως στον υπολογιστή κυρώσεων. Όχι εύρος.","suspension":false,"basis":["Άρθρο 25 ν. 4919/2022"],"special":{"ae":"Αν αλλάζει το άρθρο της έδρας, η τροποποίηση δεν είναι συμβολαιογραφική (άρθρο 4 παρ. 3 ν. 4548/2018). Αν το καταστατικό γράφει μόνο τον δήμο και η οδός μένει στον ίδιο δήμο, δεν τροποποιείται το καταστατικό.","epe":"Αν τροποποιείται το άρθρο της έδρας, το έγγραφο είναι συμβολαιογραφικό (άρθρο 38 ν. 3190/1955). Αν το καταστατικό γράφει μόνο τον δήμο και αλλάζει μόνο η οδός μέσα σε αυτόν, δεν τροποποιείται η εταιρική σύμβαση και δεν χρειάζεται συμβολαιογράφος.","ike":"Ιδιωτικό έγγραφο, όταν τροποποιείται το άρθρο της έδρας.","oe":"Τροποποίηση της εταιρικής σύμβασης με ιδιωτικό έγγραφο, αν η έδρα είναι όρος της.","ee":"Όπως στην ομόρρυθμη."},"clauses":[{"id":"seat","title":"Άρθρο έδρας","text":"Έδρα της εταιρείας ορίζεται ο Δήμος Αλεξανδρούπολης, επί της οδού … αριθμός …, τ.κ. …. Η εταιρεία μπορεί να ιδρύει υποκαταστήματα ή γραφεία αλλού, με απόφαση της διοίκησης, χωρίς τούτο να μεταβάλλει την έδρα. Κάθε μεταφορά έδρας καταχωρίζεται στο Γ.Ε.ΜΗ. εντός είκοσι ημερών."}]},{"id":"skopos","title":"Σκοπός και δραστηριότητα","group":"leitourgia","forms":["ae","epe","ike","oe","ee","synetairismos"],"channel":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας. Ο ΚΑΔ της ΔΟΥ δηλώνεται στη φορολογική μεταβολή· δεν αντικαθιστά την τροποποίηση του καταστατικού.","trigger":"Ημερομηνία της απόφασης τροποποίησης του σκοπού.","deadline":"Υποβολή εντός είκοσι ημερών από την απόφαση.","deadlineDays":20,"documents":[{"id":"decision","label":"Απόφαση που παραθέτει αυτολεξεί το νέο άρθρο του σκοπού"},{"id":"coded","label":"Κωδικοποιημένο καταστατικό"},{"id":"kad-note","label":"Δεν επισυνάπτεται ο ΚΑΔ ως δικαιολογητικό του σκοπού","hint":"Αν προστεθεί, είναι πληροφοριακό, όχι το καταστατικό κείμενο."}],"blockers":["Ο σκοπός διευρύνθηκε μόνο στη ΔΟΥ.","Η νέα δραστηριότητα αντιφάσκει με ρήτρα αποκλειστικού σκοπού που δεν καταργήθηκε."],"ifOmitted":"Η εταιρεία εμφανίζεται με σκοπό που δεν ασκεί, ή ασκεί δραστηριότητα που το καταστατικό δεν προβλέπει. Η δεύτερη περίπτωση επιστρέφεται στον έλεγχο νομιμότητας.","sanction":"Παράλειψη της τροποποίησης, άρθρο 9, μερίδα Επιμελητηρίου: κεφαλαιουχική 1.600 / 800 / 400 / 320 € κατά μέγεθος, Ο.Ε., Ε.Ε. και αστική 200 €.","suspension":false,"basis":["Άρθρο 25 ν. 4919/2022"],"clauses":[{"id":"purpose","title":"Προσθήκη δραστηριότητας","text":"Στον σκοπό της εταιρείας προστίθεται, χωρίς κατάργηση των υφιστάμενων εδαφίων, η ακόλουθη δραστηριότητα: «…». Η εταιρεία δύναται να διενεργεί κάθε συναφή πράξη που υπηρετεί ευθέως τον σκοπό αυτόν. Η προσθήκη δεν συνιστά γενική εμπορική εξουσία πέραν των όσων γράφονται στο παρόν άρθρο."}]},{"id":"dioikisi","title":"Διοίκηση και εκπροσώπηση","group":"leitourgia","forms":["ae","epe","ike","oe","ee","synetairismos"],"channel":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας.","trigger":"Για την ανώνυμη εταιρεία, η συνεδρίαση του διοικητικού συμβουλίου ή η γενική συνέλευση που εξέλεξε. Για τις λοιπές, η απόφαση των εταίρων.","deadline":"Υποβολή εντός είκοσι ημερών. Στην ανώνυμη εταιρεία η προθεσμία τρέχει από τη συνεδρίαση του διοικητικού συμβουλίου, όταν το πρακτικό καταχωρίζεται υποχρεωτικά.","deadlineDays":20,"documents":[{"id":"minutes","label":"Πρακτικό εκλογής, διορισμού ή παύσης"},{"id":"mode","label":"Ρητός τρόπος εκπροσώπησης: μονομελώς, από κοινού ή κατά όριο ποσού"},{"id":"accept","label":"Στοιχεία ταυτότητας και ΑΦΜ του νέου προσώπου και αποδοχή, όπου προβλέπεται"},{"id":"end","label":"Λήξη της θητείας που αντικαθίσταται, ώστε να μη συνυπάρχουν δύο διοικήσεις σιωπηρά"}],"blockers":["Το πρακτικό ονομάζει πρόσωπα και δεν λέει ποιος δεσμεύει την εταιρεία.","Υπογράφει πρόσωπο που η μερίδα δεν γνωρίζει ακόμη.","Δεν υπάρχει νόμιμη διοίκηση για διάστημα που ήδη υπερβαίνει τους έξι μήνες."],"ifOmitted":"Η μερίδα δείχνει την παλαιά διοίκηση. Κάθε επόμενη αίτηση που υπογράφει η νέα επιστρέφεται. Έλλειψη διοίκησης ή εκκαθαριστή άνω των έξι μηνών είναι λόγος αναστολής καταχώρισης.","sanction":"Εκπρόθεσμη αίτηση, άρθρο 7, μερίδα Επιμελητηρίου: Α.Ε. 200 €, Ε.Π.Ε. και Ι.Κ.Ε. 120 €, Ο.Ε. και Ε.Ε. 100 €. Η αναστολή, αν λείπει διοίκηση πάνω από έξι μήνες, προηγείται ως κώλυμα.","suspension":true,"basis":["Άρθρο 93 ν. 4548/2018","Άρθρο 29 ν. 4919/2022"],"clauses":[{"id":"rep-sole","title":"Μονοπρόσωπη εκπροσώπηση","text":"Η εταιρεία εκπροσωπείται και δεσμεύεται έναντι τρίτων και ενώπιον κάθε αρχής από τον … (ονοματεπώνυμο, πατρώνυμο, ΑΦΜ …), μονομελώς, για κάθε πράξη διαχείρισης και διάθεσης, χωρίς περιορισμό ποσού. Η εξουσία περιλαμβάνει την υπογραφή αιτήσεων προς το Γ.Ε.ΜΗ. και τη ΔΟΥ. Παύει αυτοδικαίως με την καταχώριση νεότερης απόφασης."},{"id":"rep-joint","title":"Από κοινού, με όριο","text":"Η εταιρεία δεσμεύεται από τον διαχειριστή μονομελώς για πράξεις έως … ευρώ. Πέραν του ορίου απαιτείται η από κοινού υπογραφή του διαχειριστή και του εταίρου …. Η είσπραξη απαιτήσεων και η υποβολή δηλώσεων σε δημόσια αρχή γίνονται μονομελώς από τον διαχειριστή."}]},{"id":"meridia","title":"Μεταβίβαση εταιρικών μεριδίων","group":"leitourgia","forms":["epe","ike","oe","ee"],"channel":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας, μαζί με την τροποποίηση του καταστατικού όπου τα στοιχεία των εταίρων είναι μέρος του.","trigger":"Ημερομηνία της συμφωνίας μεταβίβασης ή της απόφασης των εταίρων που την αποδέχεται.","deadline":"Υποβολή εντός είκοσι ημερών. Το δικαίωμα προτίμησης, όπου υπάρχει, πρέπει να έχει τηρηθεί ή να έχει παραιτηθεί πριν από την αίτηση.","deadlineDays":20,"documents":[{"id":"deed","label":"Συμφωνητικό μεταβίβασης με αριθμό μεριδίων και τίμημα"},{"id":"waiver","label":"Παραίτηση από το δικαίωμα προτίμησης ή πρακτικό που βεβαιώνει ότι τηρήθηκε"},{"id":"table","label":"Νέος πίνακας εταίρων και ποσοστών"},{"id":"coded","label":"Κωδικοποιημένο καταστατικό, αν αλλάζουν τα πρόσωπα που αναφέρει"}],"blockers":["Μεταβίβαση προς τρίτον χωρίς μνεία του δικαιώματος προτίμησης.","Τα ποσοστά του πίνακα δεν αθροίζουν στο κεφάλαιο.","Υπογράφει διαχειριστής που έχει ήδη αντικατασταθεί χωρίς καταχώριση."],"ifOmitted":"Η μερίδα δείχνει τον παλαιό εταίρο. Ο νέος δεν νομιμοποιείται έναντι τρίτων που εμπιστεύονται το Γ.Ε.ΜΗ.","sanction":"Παράλειψη, άρθρο 9, και εκπρόθεσμη αίτηση, άρθρο 7. Τα ποσά της μερίδας Επιμελητηρίου είναι ορισμένα κατά μορφή: 200 ή 100 € για την εκπρόθεσμη, και 1.600 έως 200 € για την παράλειψη, όπως στον υπολογιστή. Όχι εύρος του άρθρου 50.","suspension":false,"basis":["Ν. 3190/1955, άρθρο 28","Ν. 4072/2012, άρθρα 77 έως 84","Άρθρο 25 ν. 4919/2022"],"special":{"epe":"Η μεταβίβαση εταιρικού μεριδίου γίνεται μόνο με συμβολαιογραφικό έγγραφο. Δεν αρκεί ιδιωτικό συμφωνητικό. Παράγει αποτελέσματα έναντι της εταιρείας από την καταχώριση στο βιβλίο εταίρων και τη δημοσιότητα στο Γ.Ε.ΜΗ. (άρθρο 28 ν. 3190/1955, όπως ισχύει).","ike":"Ιδιωτικό έγγραφο (άρθρο 84 παρ. 1 ν. 4072/2012). Η μεταβίβαση εν ζωή ή αιτία θανάτου είναι κατ’ αρχήν ελεύθερη (άρθρο 83 παρ. 1). Το καταστατικό μπορεί να την περιορίσει, να τάξει δικαίωμα προτίμησης ή να απαιτήσει συναίνεση (άρθρο 84 παρ. 2). Μερίδια που αντιστοιχούν σε εξωκεφαλαιακή ή εγγυητική εισφορά η οποία δεν έχει εξοφληθεί δεν μεταβιβάζονται, έως την εξαγορά των υποχρεώσεων κατά το άρθρο 82 (άρθρο 83 παρ. 2). Κεφαλαιακή εισφορά είναι χρήμα ή εισφορά σε είδος (άρθρο 77). Εξωκεφαλαιακή είναι εργασία ή υπηρεσία που αποτιμάται στο καταστατικό (άρθρο 78). Εγγυητική είναι η ανάληψη ευθύνης έναντι τρίτων έως ορισμένο ποσό (άρθρο 79).","oe":"Δεν είναι μεταβίβαση μεριδίων κεφαλαιουχικής εταιρείας. Είναι είσοδος, έξοδος ή αντικατάσταση εταίρου, με τροποποίηση της εταιρικής σύμβασης και ιδιωτικό έγγραφο, εκτός αν εισφέρεται στοιχείο που απαιτεί συμβολαιογραφικό τύπο. Ο ομόρρυθμος ευθύνεται απεριόριστα και εις ολόκληρον.","ee":"Η μεταβολή ομόρρυθμου ή ετερόρρυθμου τροποποιεί την εταιρική σύμβαση. Ο ετερόρρυθμος ευθύνεται έως την εισφορά του και δεν γίνεται διαχειριστής. Ιδιωτικό έγγραφο, εκτός αν ο νόμος επιβάλλει συμβολαιογραφικό τύπο για το εισφερόμενο στοιχείο."},"clauses":[{"id":"waiver","title":"Παραίτηση από δικαίωμα προτίμησης","text":"Ο εταίρος … δηλώνει ότι έλαβε γνώση της πρόθεσης του εταίρου … να μεταβιβάσει … εταιρικά μερίδια, ονομαστικής αξίας … ευρώ έκαστο, προς τον …, αντί τιμήματος … ευρώ, και παραιτείται ανέκκλητα από το δικαίωμα προτίμησης για τη συγκεκριμένη μεταβίβαση και μόνο. Η παραίτηση δεν καταλαμβάνει μελλοντική μεταβίβαση."}]},{"id":"kefalaio","title":"Αύξηση ή μείωση κεφαλαίου","group":"leitourgia","forms":["ae","epe","ike"],"channel":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας.","trigger":"Ημερομηνία της απόφασης του οργάνου που είναι αρμόδιο κατά τον νόμο και το καταστατικό.","deadline":"Υποβολή της απόφασης εντός είκοσι ημερών. Η πιστοποίηση της καταβολής, στην ανώνυμη εταιρεία, είναι χωριστή πράξη και δεν καλύπτεται από την παρούσα αίτηση.","deadlineDays":20,"documents":[{"id":"decision","label":"Απόφαση με το νέο κεφάλαιο, τον αριθμό, το είδος και την ονομαστική αξία"},{"id":"terms","label":"Τρόπος κάλυψης, τιμή και προθεσμία καταβολής"},{"id":"coded","label":"Τροποποίηση καταστατικού και κωδικοποίηση"}],"blockers":["Η απόφαση λέει «αύξηση κατά … ευρώ» χωρίς το νέο σύνολο και την ονομαστική αξία.","Τακτική αύξηση ανώνυμης εταιρείας χωρίς την εξουσία που το καταστατικό έδωσε στο διοικητικό συμβούλιο."],"ifOmitted":"Το κεφάλαιο της μερίδας μένει το παλαιό. Χωρίς πιστοποίηση, όπου απαιτείται, η μερίδα μπορεί να τεθεί σε αναστολή.","sanction":"Παράλειψη, άρθρο 9, μερίδα Επιμελητηρίου, κατά μέγεθος για κεφαλαιουχική: 1.600 / 800 / 400 / 320 €. Η παράλειψη πιστοποίησης είναι αυτοτελής λόγος αναστολής.","suspension":true,"basis":["Ν. 4548/2018, άρθρο 4","Ν. 4072/2012, άρθρα 77 έως 79","Άρθρο 29 ν. 4919/2022"],"special":{"ae":"Η αύξηση ή η μείωση αποφασίζεται από τη γενική συνέλευση, ή από το διοικητικό συμβούλιο μόνο στην έκταση που ο ν. 4548/2018 και το καταστατικό το επιτρέπουν. Η τροποποίηση του καταστατικού δεν είναι συμβολαιογραφική. Συμβολαιογραφικό χρειάζεται αν εισφέρεται ακίνητο ή άλλο στοιχείο για το οποίο ο νόμος απαιτεί αυτόν τον τύπο. Η πιστοποίηση της καταβολής είναι επόμενη, χωριστή πράξη.","epe":"Η απόφαση των εταίρων και η τροποποίηση της εταιρικής σύμβασης γίνονται με συμβολαιογραφικό έγγραφο (άρθρο 38 ν. 3190/1955). Δεν υποβάλλεται ιδιωτικό πρακτικό ως καταστατικό.","ike":"Η αύξηση μπορεί να είναι κεφαλαιακή, εξωκεφαλαιακή ή εγγυητική. Η εξωκεφαλαιακή και η εγγυητική αποτιμώνται στο καταστατικό και δεν είναι καταβολή μετρητών. Η πιστοποίηση αφορά την καταβολή κεφαλαιακής εισφοράς. Μερίδια εξωκεφαλαιακής ή εγγυητικής εισφοράς που δεν έχει εξοφληθεί δεν μεταβιβάζονται."}},{"id":"pistopoiisi","title":"Πιστοποίηση καταβολής κεφαλαίου","group":"leitourgia","forms":["ae","ike"],"formsNote":"Υποχρεωτικό στάδιο μετά την αύξηση, όχι υποκατάστατο της απόφασης αύξησης.","channel":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας.","trigger":"Ημερομηνία καταβολής του κεφαλαίου.","deadline":"Η πιστοποίηση γίνεται εντός ενός μηνός από την καταβολή και καταχωρίζεται στο Γ.Ε.ΜΗ.","deadlineDays":30,"documents":[{"id":"cert","label":"Πράξη πιστοποίησης από το όργανο ή το πρόσωπο που ο νόμος ορίζει"},{"id":"proof","label":"Μνεία του ποσού, του λογαριασμού ή του τρόπου καταβολής και της ημερομηνίας"},{"id":"link","label":"Συσχετισμός με την ήδη καταχωρισμένη απόφαση αύξησης"}],"blockers":["Η πιστοποίηση υποβάλλεται πριν καταχωριστεί η αύξηση.","Το ποσό που πιστοποιείται δεν ταυτίζεται με την απόφαση."],"ifOmitted":"Παράλειψη πιστοποίησης εντός της νόμιμης προθεσμίας, σε ανώνυμη και ιδιωτική κεφαλαιουχική εταιρεία, είναι λόγος αναστολής καταχώρισης.","sanction":"Η αναστολή είναι το άμεσο κώλυμα. Η εκπρόθεσμη αίτηση, άρθρο 7, για μερίδα Επιμελητηρίου είναι 200 € στην Α.Ε. και 120 € στην Ι.Κ.Ε.","suspension":true,"basis":["Άρθρο 29 ν. 4919/2022","Ν. 4548/2018"],"clauses":[{"id":"cert-text","title":"Πιστοποιητική διατύπωση","text":"Πιστοποιείται ότι καταβλήθηκε ολοσχερώς το ποσό των … ευρώ, που αντιστοιχεί στην αύξηση του κεφαλαίου που αποφασίστηκε την … και καταχωρίστηκε στο Γ.Ε.ΜΗ. με κωδικό ανακοίνωσης …. Η καταβολή έγινε την … στον λογαριασμό της εταιρείας …. Το κεφάλαιο ανέρχεται πλέον σε … ευρώ, διαιρούμενο σε … μετοχές / μερίδια, ονομαστικής αξίας … ευρώ έκαστο."}]},{"id":"oikonomikes","title":"Ετήσιες οικονομικές καταστάσεις","group":"logistiki","forms":["ae","epe","ike","oe","ee","synetairismos","ypokatastima"],"formsNote":"Ο.Ε. και Ε.Ε. δημοσιεύουν μόνο όταν όλοι οι ομόρρυθμοι είναι νομικά πρόσωπα περιορισμένης ευθύνης.","special":{"ae":"Τακτική γενική συνέλευση. Υποχρεωτική δημοσίευση. Δεν συγχέεται με τη δήλωση στη ΔΟΥ.","epe":"Έγκριση από τη συνέλευση των εταίρων. Υποχρεωτική δημοσίευση.","ike":"Έγκριση από τους εταίρους. Υποχρεωτική δημοσίευση.","oe":"Δημοσίευση μόνο αν όλοι οι ομόρρυθμοι εταίροι είναι νομικά πρόσωπα περιορισμένης ευθύνης ή ισοδύναμης μορφής (άρθρο 1 παρ. 2 περ. β΄ ν. 4308/2014). Αλλιώς η πράξη δεν ενεργοποιείται και δεν επιβάλλεται το πρόστιμο του άρθρου 10.","ee":"Ίδιος κανόνας με την ομόρρυθμη: δημοσίευση μόνο όταν όλοι οι ομόρρυθμοι είναι νομικά πρόσωπα περιορισμένης ευθύνης.","synetairismos":"Αστικός συνεταιρισμός: καταληκτική δημοσίευση την 20ή Ιουλίου του επόμενου έτους, όχι η 10η Σεπτεμβρίου των κεφαλαιουχικών.","ypokatastima":"Υποκατάστημα αλλοδαπής των άρθρων 41 και 43 έως 45: δημοσίευση έως την 31η Δεκεμβρίου του επόμενου έτους."},"channel":"Ηλεκτρονική αίτηση στην Υπηρεσία Γ.Ε.ΜΗ. της έδρας.","trigger":"Ημερομηνία έγκρισης από την τακτική συνέλευση ή το αρμόδιο όργανο. Όχι η καταληκτική ημερομηνία σύγκλησης.","deadline":"Υποβολή εντός είκοσι ημερών από τη λήψη της απόφασης έγκρισης, όχι από τη λήξη της χρήσης (άρθρο 25 παρ. 3). Η συνέλευση, χωρίς παράταση, συνέρχεται έως τη 10η ημέρα του ένατου μήνα από τη λήξη (10 Σεπτεμβρίου, αν η χρήση έληξε 31 Δεκεμβρίου). Αν η έγκριση γίνει εκείνη την ημέρα, η υποβολή λήγει στις 30 Σεπτεμβρίου. Η 30ή Σεπτεμβρίου δεν είναι αυτοτελής προθεσμία του Γ.Ε.ΜΗ. Αστικοί συνεταιρισμοί: 20 Ιουλίου του επόμενου έτους. Υποκαταστήματα αλλοδαπής των άρθρων 41 και 43 έως 45: 31 Δεκεμβρίου του επόμενου έτους. Η παράταση συνελεύσεων του 2026 και η ανακοίνωση για 31 Οκτωβρίου μένουν στη λωρίδα έτους, έως ότου δημοσιευθεί ΦΕΚ.","deadlineDays":20,"documents":[{"id":"minutes","label":"Πρακτικό έγκρισης, με την χρήση στην οποία αφορά"},{"id":"fs","label":"Οι εγκεκριμένες καταστάσεις, όχι προσχέδιο λογιστή"},{"id":"notes","label":"Προσάρτημα και έκθεση διαχείρισης, όπου απαιτούνται"},{"id":"audit","label":"Έκθεση ελέγχου, αν ο έλεγχος είναι υποχρεωτικός ή αποφασίστηκε"}],"blockers":["Η διοίκηση που υπογράφει δεν είναι η καταχωρισμένη.","Εκκρεμεί προηγούμενη χρήση και η μερίδα είναι ήδη σε αναστολή.","Υποβάλλονται ισολογισμός έναρξης ή πέρατος εκκαθάρισης με το έντυπο των ετήσιων καταστάσεων."],"ifOmitted":"Λόγος αναστολής καταχώρισης. Κλείνει κάθε επόμενη αίτηση έως τη θεραπεία. Είναι και η βαρύτερη διοικητική κύρωση του μητρώου.","sanction":"Μη δημοσίευση, άρθρο 10, μερίδα Επιμελητηρίου: 10.000 € μεγάλη, 5.000 μεσαία, 2.500 μικρή, 1.000 πολύ μικρή. Ο συνεταιρισμός δεν παίρνει αυτόματα αυτή την κλίμακα. Υποκατάστημα αλλοδαπής σε επιμελητήριο: 1.000 €. Γενική Γραμματεία: 100.000 / 50.000 / 25.000 / 10.000 € και 10.000 € το υποκατάστημα. Οι δύο κλίμακες δεν αθροίζονται.","suspension":true,"basis":["Άρθρα 25 και 29 ν. 4919/2022","Άρθρο 119 ν. 4548/2018","Άρθρο 69 ν. 4072/2012","Άρθρο 10 ν. 3190/1955","ΚΥΑ 46982/2025, άρθρο 10"]},{"id":"lysi","title":"Λύση και θέση σε εκκαθάριση","group":"telos","forms":["ae","epe","ike","oe","ee","synetairismos"],"channel":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας.","trigger":"Ημερομηνία της απόφασης λύσης.","deadline":"Υποβολή εντός είκοσι ημερών. Ο ισολογισμός έναρξης εκκαθάρισης είναι επόμενο, αυτοτελές στάδιο.","deadlineDays":20,"documents":[{"id":"decision","label":"Απόφαση λύσης και θέσης σε εκκαθάριση"},{"id":"liquidators","label":"Ορισμός εκκαθαριστών, στοιχεία τους και τρόπος εκπροσώπησης"},{"id":"reason","label":"Λόγος λύσης, ώστε να ελέγχεται η αρμοδιότητα του οργάνου"}],"blockers":["Ορίζονται εκκαθαριστές χωρίς τρόπο εκπροσώπησης.","Η λύση «περνά» ως απλή τροποποίηση διάρκειας."],"ifOmitted":"Η εταιρεία εμφανίζεται ενεργή. Χωρίς εκκαθαριστή επί έξι μήνες επέρχεται αναστολή.","sanction":"Παράλειψη, άρθρο 9, μερίδα Επιμελητηρίου: κεφαλαιουχική κατά μέγεθος 1.600 / 800 / 400 / 320 €, Ο.Ε. και Ε.Ε. 200 €. Χωριστά, αναστολή αν λείπει εκκαθαριστής πέραν του εξαμήνου.","suspension":true,"basis":["Άρθρο 29 ν. 4919/2022"],"clauses":[{"id":"liq","title":"Ορισμός εκκαθαριστή","text":"Η εταιρεία λύεται και τίθεται σε εκκαθάριση από την καταχώριση της παρούσας. Εκκαθαριστής ορίζεται ο … (ΑΦΜ …), ο οποίος εκπροσωπεί την εταιρεία μονομελώς για τις πράξεις της εκκαθάρισης. Απαγορεύεται η ανάληψη νέας δραστηριότητας. Ο εκκαθαριστής υποχρεούται να καταρτίσει ισολογισμό έναρξης εκκαθάρισης και να τον υποβάλει στο Γ.Ε.ΜΗ. εντός έτους."}]},{"id":"enarxi-ekkatharisis","title":"Ισολογισμός έναρξης εκκαθάρισης","group":"telos","forms":["ae","epe","ike","oe","ee","synetairismos"],"channel":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας. Δεν υποβάλλεται ως ετήσια οικονομική κατάσταση.","trigger":"Ημερομηνία θέσης σε λύση και εκκαθάριση.","deadline":"Δημοσίευση εντός ενός έτους από τη θέση σε λύση. Η υπέρβαση είναι αυτοτελής λόγος αναστολής.","deadlineDays":365,"documents":[{"id":"bs","label":"Ισολογισμός έναρξης εκκαθάρισης"},{"id":"link","label":"Συσχετισμός με την καταχωρισμένη απόφαση λύσης"},{"id":"sign","label":"Υπογραφή εκκαθαριστή που είναι ήδη καταχωρισμένος"}],"blockers":["Δεν έχει προηγηθεί η καταχώριση της λύσης.","Υποβάλλεται ο τελευταίος ισολογισμός χρήσης στη θέση του ισολογισμού έναρξης."],"ifOmitted":"Μετά το έτος η μερίδα τίθεται σε αναστολή, ακόμη και αν οι ετήσιες καταστάσεις ήταν εντάξει.","sanction":"Αναστολή καταχώρισης. Η εκπρόθεσμη αίτηση επισύρει επιπλέον την κύρωση του άρθρου 7.","suspension":true,"basis":["Άρθρο 29 ν. 4919/2022"]},{"id":"peras-diagrafi","title":"Πέρας εκκαθάρισης και διαγραφή","group":"telos","forms":["ae","epe","ike","oe","ee","synetairismos"],"channel":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας.","trigger":"Ολοκλήρωση της εκκαθάρισης και απόφαση του αρμόδιου οργάνου ή του εκκαθαριστή, κατά τη μορφή.","deadline":"Η διαγραφή ακολουθεί το πέρας. Δεν υποκαθιστά ούτ ιθμό, το είδος και την ονομαστική αξία. Χωρίς αυτά ο έλεγχος δεν κλείνει.","wrong":"Μία πρόταση με το ποσό της αύξησης και εξουσιοδότηση «να συμπληρωθούν τα τυπικά».","right":"«Το κεφάλαιο αυξάνεται από 25.000 ευρώ σε 75.000 ευρώ, με έκδοση 5.000 νέων μεριδίων, ονομαστικής αξίας 10 ευρώ έκαστο, που καλύπτονται εξ ολοκλήρου από τον εταίρο … και καταβάλλονται εντός μηνός.»","actIds":["kefalaio","pistopoiisi"]},{"id":"no-codification","title":"Τροποποίηση χωρίς κωδικοποίηση","frequency":"συχνό","symptom":"Συνημμένο μόνο το πρακτικό. Το καταστατικό στη μερίδα μένει το ιδρυτικό.","why":"Ο τρίτος πρέπει να διαβάζει ένα κείμενο, όχι το άθροισμα δέκα πρακτικών. Η Υπηρεσία ζητά το κωδικοποιημένο σώμα.","wrong":"«Τα λοιπά άρθρα παραμένουν ως έχουν», χωρίς να επισυνάπτεται το σώμα στο οποίο παραμένουν.","right":"Πρακτικό συν ένα κωδικοποιημένο καταστατικό που ενσωματώνει την τροποποίηση και αναφέρει την ημερομηνία της.","actIds":["katastatiko","edra","skopos","meridia"]},{"id":"preemption","title":"Μεταβίβαση χωρίς δικαίωμα προτίμησης","frequency":"σοβαρό","symptom":"Μερίδια εταιρείας περιορισμένης ευθύνης ή ιδιωτικής κεφαλαιουχικής περνούν σε τρίτον με ιδιωτικό συμφωνητικό μόνο.","why":"Αν το καταστατικό ή ο νόμος δίνει δικαίωμα προτίμησης, η παράλειψή του είναι λόγος επιστροφής, όχι τυπική έλλειψη σφραγίδας.","wrong":"Συμφωνητικό πώλησης και αίτηση «να ενημερωθεί ο πίνακας εταίρων».","right":"Συμφωνητικό, παραίτηση των λοιπών εταίρων από το δικαίωμα προτίμησης για τη συγκεκριμένη μεταβίβαση, νέος πίνακας και κωδικοποίηση.","actIds":["meridia"]},{"id":"liquidation-bs","title":"Λύση χωρίς ισολογισμό έναρξης","frequency":"σοβαρό","symptom":"Η εταιρεία λύθηκε πέρυσι. Νέα αίτηση δεν γίνεται δεκτή.","why":"Η παράλειψη ισολογισμού έναρξης εκκαθάρισης για διάστημα μεγαλύτερο του έτους είναι αυτοτελής λόγος αναστολής, δίπλα στην έλλειψη εκκαθαριστή.","wrong":"Επανυποβολή της απόφασης λύσης με την ένδειξη «διορθωτικό».","right":"Καταχώριση ισολογισμού έναρξης εκκαθάρισης, υπογεγραμμένου από τον ήδη καταχωρισμένο εκκαθαριστή, με ρητή αναφορά στην απόφαση λύσης.","actIds":["lysi","enarxi-ekkatharisis"]},{"id":"second-incorporation","title":"Δεύτερη σύσταση αντί διόρθωσης","frequency":"σοβαρό","symptom":"Λάθος επωνυμία ή λάθος εκπρόσωπος στην ηλεκτρονική Υπηρεσία Μίας Στάσης. Ο συμβουλευόμενος ξεκινά νέα σύσταση.","why":"Το σφάλμα της e-ΥΜΣ διορθώνεται με αίτηση στην Υπηρεσία Γ.Ε.ΜΗ. Δεύτερη σύσταση δημιουργεί δεύτερη μερίδα και νέα παράβαση.","wrong":"Νέα δέσμευση επωνυμίας «διορθωμένη» και νέα έναρξη.","right":"Αίτηση διόρθωσης προς την αρμόδια Υπηρεσία, με περιγραφή του σφάλματος, του ορθού στοιχείου και της υπαιτιότητας του υπόχρεου. Μία μερίδα, μία επωνυμία.","actIds":["systasi","eponymia"]},{"id":"missing-particulars","title":"Εταιρικά έγγραφα χωρίς στοιχεία μερίδας","frequency":"συχνό","symptom":"Επιστολόχαρτο, προσφορά ή σύμβαση χωρίς αριθμό Γ.Ε.ΜΗ. και έδρα.","why":"Η παράλειψη είναι αυτοτελής παράβαση, μικρή σε ποσό και εύκολη στη διαπίστωση, διότι τα έγγραφα κυκλοφορούν.","wrong":"Μόνο η επωνυμία και ένας αριθμός τηλεφώνου.","right":"Επωνυμία, έδρα, αριθμός Γ.Ε.ΜΗ. και ΑΦΜ σε κάθε έγγραφο της εταιρείας, κατά τα άρθρα 22 και 37 του νόμου και το άρθρο 6 της ΚΥΑ.","actIds":["systasi","edra"]},{"id":"transformation-as-amendment","title":"Μετασχηματισμός δηλωμένος ως τροποποίηση","frequency":"σοβαρό","symptom":"Μετατροπή εταιρείας περιορισμένης ευθύνης σε ιδιωτική κεφαλαιουχική με ένα πρακτικό αλλαγής νομικής μορφής.","why":"Το αποτέλεσμα συγχώνευσης, διάσπασης ή μετατροπής επέρχεται με την καταχώριση της ολοκλήρωσης κατά τον ν. 4601/2019, αφού τηρηθούν τα στάδια δημοσιότητας.","wrong":"«Τροποποιείται η νομική μορφή από Ε.Π.Ε. σε Ι.Κ.Ε.» ως μοναδικό άρθρο πρακτικού.","right":"Σχέδιο, δημοσιότητα του σχεδίου, αποφάσεις οργάνων, σύμβαση όπου απαιτείται, και χωριστή αίτηση καταχώρισης της ολοκλήρωσης. Κάθε εταιρεία στη δική της μερίδα.","actIds":["metaschimatismos"]},{"id":"afm-dead","title":"Ανενεργός ΑΦΜ","frequency":"σοβαρό","symptom":"Η αίτηση δεν καταχωρίζεται και το πιστοποιητικό γράφει αναστολή, χωρίς να λείπει πρακτικό.","why":"Αναστολή ή απενεργοποίηση του ΑΦΜ από την ΑΑΔΕ είναι λόγος αναστολής καταχώρισης. Δεν αίρεται από την Υπηρεσία Γ.Ε.ΜΗ. με νέο πρακτικό.","wrong":"Υπεύθυνη δήλωση προς το Επιμελητήριο ότι «ο ΑΦΜ θα τακτοποιηθεί».","right":"Τακτοποίηση στην ΑΑΔΕ. Η άρση έρχεται με την ενημέρωση του μητρώου. Έως τότε γίνονται δεκτές μόνο αυτεπάγγελτες καταχωρίσεις.","actIds":["oikonomikes","dioikisi","edra"]},{"id":"fee-confused","title":"Συνδρομή επιμελητηρίου αντί τέλους Γ.Ε.ΜΗ.","frequency":"συχνό","symptom":"Η αίτηση δεν προχωρά και ο επαγγελματίας επικαλείται απόδειξη συνδρομής μέλους.","why":"Το ετήσιο τέλος Γ.Ε.ΜΗ. είναι προαπαιτούμενο των υπηρεσιών του μητρώου και δεν ταυτίζεται με τη συνδρομή του Επιμελητηρίου. Οφειλή συνδρομής, μόνη της, δεν είναι λόγος άρνησης υπηρεσίας Γ.Ε.ΜΗ.","wrong":"«Είμαστε ταμειακώς ενήμεροι στο Επιμελητήριο, άρα και στο Γ.Ε.ΜΗ.»","right":"Έλεγχος του ετήσιου τέλους Γ.Ε.ΜΗ. στο πληροφοριακό σύστημα, χωριστά από την καρτέλα μέλους. Το τέλος καταχώρισης οφείλεται ανά αίτηση που ελέγχεται. Οι αυτόματες καταχωρίσεις δεν το φέρουν.","actIds":["systasi","oikonomikes"]}],"calendar":[{"month":"Ιανουάριος","peak":true,"items":["Ανοίγει το πρώτο τρίμηνο του ετήσιου τέλους Γ.Ε.ΜΗ. Χωρίς αυτό δεν προχωρούν οι υπηρεσίες του μητρώου.","Κλείνει, όπου δεν δόθηκε νεότερη παράταση, η τακτοποίηση που έληξε στις 31 Ιανουαρίου 2026."]},{"month":"Φεβρουάριος","peak":false,"items":["Συνεχίζεται η προθεσμία του ετήσιου τέλους.","Οι εικοσαήμερες προθεσμίες μεταβολών τρέχουν κανονικά· δεν αναστέλλονται από τον λογιστικό φόρτο."]},{"month":"Μάρτιος","peak":true,"items":["Λήγει το πρώτο τρίμηνο: καταληκτική περίοδος ετήσιου τέλους Γ.Ε.ΜΗ.","Εταιρείες με λήξη χρήσης 30 Ιουνίου έχουν ήδη περάσει το εννεάμηνο του προηγούμενου κύκλου. Έλεγχος αναστολής πριν από οποιαδήποτε νέα αίτηση."]},{"month":"Απρίλιος","peak":false,"items":["Προετοιμασία συνελεύσεων για χρήσεις που έληξαν στις 31 Ιουλίου του προηγούμενου ημερολογιακού έτους.","Έλεγχος διοίκησης: αν η θητεία έληξε μέσα στο τρίμηνο, η μεταβολή προηγείται του ισολογισμού."]},{"month":"Μάιος","peak":false,"items":["Συνεδριάσεις διοικητικών συμβουλίων για έγκριση σχεδίου καταστάσεων. Το σχέδιο δεν δημοσιεύεται.","Πιστοποιήσεις κεφαλαίου που καταβλήθηκε τον Απρίλιο: τρέχει ο μήνας."]},{"month":"Ιούνιος","peak":false,"items":["Εταιρείες με λήξη 30 Σεπτεμβρίου πλησιάζουν το εννεάμηνο.","Έλεγχος υποκαταστημάτων: η προθεσμία τους δεν είναι η 30ή Σεπτεμβρίου."]},{"month":"Ιούλιος","peak":true,"items":["20 Ιουλίου: καταληκτική δημοσίευση οικονομικών καταστάσεων αστικών συνεταιρισμών, για χρήση που έληξε το προηγούμενο ημερολογιακό έτος.","Πρώτο κύμα τακτικών συνελεύσεων εταιρειών με λήξη 31 Δεκεμβρίου, αν δεν αναμένουν την απώτατη ημερομηνία."]},{"month":"Αύγουστος","peak":false,"items":["Οι προθεσμίες δεν αναστέλλονται λόγω θέρους. Εικοσαήμερη που ξεκινά στις 25 Ιουλίου λήγει μέσα στον Αύγουστο.","Κατάλληλος μήνας για έλεγχο αναστολής, πριν από τον Σεπτέμβριο."]},{"month":"Σεπτέμβριος","peak":true,"items":["10 Σεπτεμβρίου: απώτατη τακτική συνέλευση, χωρίς παράταση, για χρήση 1.1–31.12.","30 Σεπτεμβρίου: απώτατη δημοσίευση καταστάσεων στο Γ.Ε.ΜΗ., χωρίς παράταση, για την ίδια χρήση.","Κάθε παράταση γράφεται στη λωρίδα του έτους και δεν μετακινεί αυτές τις δύο ημερομηνίες από τον κανόνα."]},{"month":"Οκτώβριος","peak":true,"items":["Μήνας των παρατάσεων, όταν δοθούν. Για το 2026 η λωρίδα έτους μεταθέτει τη συνέλευση έως τις 10 Οκτωβρίου.","Αν η έγκριση γίνει νωρίτερα, οι είκοσι ημέρες τρέχουν από την πραγματική έγκριση, όχι από τις 10 ή τις 31."]},{"month":"Νοέμβριος","peak":false,"items":["Χρήσεις που έληξαν 31 Ιανουαρίου ή 28 Φεβρουαρίου έχουν συνέλευση και δημοσίευση μέσα στο φθινόπωρο, με μετατόπιση ίση προς την παράταση του έτους.","Έλεγχος πιστοποιήσεων κεφαλαίου που αποφασίστηκαν μαζί με τις συνελεύσεις."]},{"month":"Δεκέμβριος","peak":true,"items":["31 Δεκεμβρίου: καταληκτική δημοσίευση οικονομικών καταστάσεων υποκαταστημάτων αλλοδαπής για την προηγούμενη χρήση.","Πριν από την αλλαγή του έτους: εκκρεμείς μεταβολές διοίκησης, ώστε η νέα χρήση να μην ανοίξει με αναστολή εξαμήνου."]}],"changes":[{"version":"2026.10","date":"4 Οκτωβρίου 2026","title":"Πρώτη έκδοση του Κώδικα Μερίδας","effect":"Έλεγχος 4.10.2026. Η ΚΥΑ 46982/2025 τάσσει ορισμένο ποσό ανά μορφή, όχι το εύρος του άρθρου 50. Η 104666/2025 (ΦΕΚ Β΄ 7204/31.12.2025) μετάθεσε την έναρξη των κυρώσεων στις 2.2.2026, χωρίς να αλλάξει τα ποσά. Οι κυρώσεις ήδη εφαρμόζονται.","kind":"ekdosi"},{"version":"λωρίδα","date":"1 Οκτωβρίου 2026","title":"Ψηφίστηκε παράταση συνελεύσεων, χωρίς ΦΕΚ ακόμη","effect":"Η Βουλή ενέκρινε το σχέδιο νόμου για τις άμεσες ξένες επενδύσεις. Το άρθρο 40, όπως κατατέθηκε, παρατείνει κατά 30 ημέρες τις συνελεύσεις Α.Ε., Ε.Π.Ε. και Ι.Κ.Ε. για το 2026. Έως 4.10.2026 δεν εντοπίστηκε ΦΕΚ. Δεν αλλάζει τον κανόνα.","kind":"lorida"},{"version":"λωρίδα","date":"9 Σεπτεμβρίου 2026","title":"Ανακοίνωση παράτασης καταστάσεων χρήσης 2025","effect":"Το Υπουργείο ανήγγειλε νομοθετική ρύθμιση για δημοσίευση έως τις 31 Οκτωβρίου 2026. Δεν είναι ΦΕΚ. Η υποβολή μένει στις είκοσι ημέρες από τη λήψη της απόφασης.","kind":"lorida"},{"version":"λωρίδα","date":"2026","title":"Σχέδιο παράτασης συνελεύσεων, όχι ακόμη κανόνας","effect":"Η διάταξη που κατατέθηκε μεταθέτει τη 10η Σεπτεμβρίου στη 10η Οκτωβρίου 2026 για Α.Ε., Ε.Π.Ε. και Ι.Κ.Ε. Εφαρμόζεται μόνο αφού δημοσιευθεί. Αν εγκρινόταν στις 10 Οκτωβρίου, η υποβολή θα έληγε στις 30 Οκτωβρίου.","kind":"lorida"},{"version":"κανόνας","date":"28 Απριλίου 2026","title":"Παράταση αν ο λογιστής νοσηλεύεται ή αποβιώσει","effect":"Άρθρο 233 ν. 5297/2026 (ΦΕΚ Α΄ 64/28.04.2026). Νοσηλεία λογιστή τουλάχιστον τριών ημερών: οι προθεσμίες που λήγουν από την 1η έως την 30ή ημέρα της νοσηλείας μετατίθενται έως το τέλος του επόμενου μήνα από το εξιτήριο, ή από τη συμπλήρωση των τριάντα ημερών αν η νοσηλεία κρατήσει περισσότερο. Θάνατος: έως το τέλος του μεθεπόμενου μήνα. Μόνο για πελάτες με εξουσιοδότηση ή τήρηση βιβλίων ήδη από τον προηγούμενο μήνα. Στο διάστημα αυτό δεν επιβάλλεται κύρωση, αν η καθυστέρηση οφείλεται μόνο σε αυτόν τον λόγο.","kind":"kanonas"},{"version":"κανόνας","date":"2 Φεβρουαρίου 2026","title":"Έναρξη επιβολής κυρώσεων","effect":"Κατά το άρθρο 20 της ΚΥΑ, όπως τροποποιήθηκε με την 104666/2025 (ΦΕΚ Β΄ 7204/31.12.2025), η τακτοποίηση χωρίς κύρωση έληξε την 31.1.2026. Από τις 2.2.2026 οι Υ.Γ.Ε.ΜΗ. επιβάλλουν τις κυρώσεις.","kind":"kanonas"},{"version":"κανόνας","date":"8 Ιουλίου 2025","title":"Δημοσίευση της ΚΥΑ 46982/2025","effect":"ΦΕΚ Β΄ 3542/08.07.2025. Ορίζει κριτήρια και ύψος κυρώσεων του άρθρου 50 του ν. 4919/2022. Τα ποσά διαβάζονται από το ΦΕΚ, όχι από αποδόσεις.","kind":"kanonas"},{"version":"κανόνας","date":"1 Σεπτεμβρίου 2025","title":"Ηλεκτρονική υποβολή","effect":"Κατά την υπουργική απόφαση 36588/2025 (ΦΕΚ Β΄ 3217/24.06.2025) οι αιτήσεις καταχώρισης υποβάλλονται μέσω του businessportal.gr, με κωδικούς TAXISnet.","kind":"kanonas"},{"version":"κανόνας","date":"1 Ιουλίου 2022","title":"Αναστολή καταχώρισης","effect":"Άρθρο 29 ν. 4919/2022. Πέντε λόγοι κλείνουν τη μερίδα σε νέες αιτήσεις. Προηγείται ειδοποίηση δέκα εργάσιμων ημερών.","kind":"kanonas"}],"yearStrip":[{"id":"ga","status":"Ψηφίστηκε, χωρίς ΦΕΚ","title":"Συνέλευση χρήσης 2025","text":"Ο κανόνας, χωρίς παράταση, είναι η 10η Σεπτεμβρίου 2026. Την 1.10.2026 η Βουλή ενέκρινε σχέδιο που τη μεταθέτει στις 10 Οκτωβρίου για Α.Ε., Ε.Π.Ε. και Ι.Κ.Ε. Έως τον έλεγχο της 4.10.2026 δεν εντοπίστηκε ΦΕΚ, άρα δεν εφαρμόζεται."},{"id":"file","status":"Κανόνας","title":"Είκοσι ημέρες από τη λήψη της απόφασης","text":"Άρθρο 25 παρ. 3 ν. 4919/2022. Αν η έγκριση γίνει τη 10η Σεπτεμβρίου, η υποβολή λήγει στις 30 Σεπτεμβρίου. Η ημερομηνία αυτή είναι αποτέλεσμα της πρόσθεσης, όχι χωριστή προθεσμία."},{"id":"announce","status":"Ανακοινώθηκε","title":"Έως 31 Οκτωβρίου, μόνο αν υπάρξει ΦΕΚ","text":"Στις 9 Σεπτεμβρίου 2026 το Υπουργείο Ανάπτυξης ανήγγειλε ρύθμιση για δημοσίευση των καταστάσεων της χρήσης 2025 έως τις 31 Οκτωβρίου 2026. Μέχρι τη δημοσίευση δεν αλλάζει τον κανόνα."}],"suspension":["Δεν δημοσιεύθηκαν εμπρόθεσμα οι ετήσιες οικονομικές καταστάσεις, όπου απαιτείται.","Δεν υπάρχει νόμιμη διοίκηση ή εκκαθαριστής για διάστημα μεγαλύτερο των έξι μηνών.","Δεν δημοσιεύθηκε ισολογισμός έναρξης εκκαθάρισης εντός έτους από τη λύση.","Ο ΑΦΜ έχει ανασταλεί ή απενεργοποιηθεί από την ΑΑΔΕ.","Δεν πιστοποιήθηκε η καταβολή του κεφαλαίου, σε ανώνυμη και ιδιωτική κεφαλαιουχική, εντός της νόμιμης προθεσμίας."],"fineRows":[{"article":"4","breach":"Λάθη στη σύσταση μέσω e-ΥΜΣ","range":"5.000 / 2.000 / 500 €","note":"Α.Ε. · Ι.Κ.Ε., Ε.Π.Ε., συνεταιρισμός · Ο.Ε., Ε.Ε., αστική. Ίδιο για κάθε υπηρεσία."},{"article":"5","breach":"Παράλειψη εγγραφής στο Γ.Ε.ΜΗ.","range":"Επιμελητήριο 2.000 / 1.200 / 1.000 €","note":"Α.Ε. · Ε.Π.Ε., Ι.Κ.Ε., συνεταιρισμός, υποκατάστημα · Ο.Ε., Ε.Ε. Γενική Γραμματεία: 10.000 € και 6.000 € το υποκατάστημα."},{"article":"6","breach":"Μη αναγραφή στοιχείων στα εταιρικά έγγραφα","range":"Επιμελητήριο 200 / 120 / 100 €","note":"Α.Ε. · Ε.Π.Ε., Ι.Κ.Ε., συνεταιρισμός, υποκατάστημα · Ο.Ε., Ε.Ε., αστική. Γενική Γραμματεία: 500 € και 300 € το υποκατάστημα."},{"article":"7","breach":"Εκπρόθεσμη υποβολή αίτησης","range":"Επιμελητήριο 200 / 120 / 100 €","note":"Ίδια στήλη με το άρθρο 6. Είκοσι ημέρες από τη λήψη της απόφασης."},{"article":"8","breach":"Λάθη σε αυτόματες καταχωρίσεις","range":"Επιμελητήριο 1.600–320 € ή 200 €","note":"Κεφαλαιουχική κατά μέγεθος 1.600 / 800 / 400 / 320 €. Συνεταιρισμός και υποκατάστημα 320 €. Ο.Ε., Ε.Ε., αστική 200 €."},{"article":"9","breach":"Παράλειψη υποχρεωτικής πράξης","range":"Επιμελητήριο 1.600–320 € ή 200 €","note":"Ίδια λογική μεγέθους με τα άρθρα 8 και 11 για μερίδα Επιμελητηρίου."},{"article":"10","breach":"Μη δημοσίευση οικονομικών καταστάσεων","range":"Επιμελητήριο 10.000–1.000 €","note":"Μεγάλη 10.000, μεσαία 5.000, μικρή 2.500, πολύ μικρή 1.000. Υποκατάστημα επιμελητηρίου 1.000. Γενική Γραμματεία 100.000 / 50.000 / 25.000 / 10.000."},{"article":"11","breach":"Επωνυμία και διακριτικός τίτλος","range":"Επιμελητήριο 1.600–320 € ή 200 €","note":"Κατά μέγεθος στις κεφαλαιουχικές. Όχι εύρος 200 έως 2.000."}],"fees":[{"label":"Α.Ε., ενεργή","amount":"320 €"},{"label":"Υποκατάστημα αλλοδαπής Α.Ε.","amount":"300 €"},{"label":"Ε.Π.Ε., ενεργή","amount":"150 €"},{"label":"Κοιν.Σ.Π.Ε.","amount":"100 €"},{"label":"Σε λύση και εκκαθάριση","amount":"το ήμισυ"},{"label":"Σε πτώχευση","amount":"δεν οφείλεται"}],"fsFines":{"chamber":[{"size":"Μεγάλη","amount":"10.000 €"},{"size":"Μεσαία","amount":"5.000 €"},{"size":"Μικρή","amount":"2.500 €"},{"size":"Πολύ μικρή","amount":"1.000 €"}],"secretariat":[{"size":"Εισηγμένη ή μεγάλη","amount":"100.000 €"},{"size":"Μεσαία","amount":"50.000 €"},{"size":"Μικρή","amount":"25.000 €"},{"size":"Πολύ μικρή ή υποκατάστημα αλλοδαπής","amount":"10.000 €"}]},"trees":{"edra":{"start":"where","nodes":{"where":{"question":"Πού μεταφέρεται η έδρα;","options":[{"label":"Άλλη οδός, ίδιος δήμος","next":"street"},{"label":"Άλλος δήμος, εντός Έβρου","next":"inside"},{"label":"Εκτός Έβρου, π.χ. Αθήνα","next":"outside"}]},"street":{"question":"Το καταστατικό γράφει συγκεκριμένη οδό ή μόνο τον δήμο;","options":[{"label":"Γράφει οδό και αριθμό","next":"amend"},{"label":"Γράφει μόνο τον δήμο","next":"noamend"}]},"amend":{"outcome":"Απαιτείται απόφαση του αρμόδιου οργάνου και, αν το καταστατικό γράφει οδό, τροποποίηση του άρθρου της έδρας. Στην Ε.Π.Ε. η τροποποίηση είναι συμβολαιογραφική. Στην Α.Ε. και στην Ι.Κ.Ε. είναι ιδιωτικό έγγραφο. Προθεσμία: είκοσι ημέρες. Η νέα διεύθυνση γράφεται πλήρης.","links":[{"label":"Κάρτα πράξης","href":"/acts/edra"}]},"noamend":{"outcome":"Αν το καταστατικό ορίζει έδρα μόνο τον δήμο και η μετακίνηση μένει εντός του, δεν τροποποιείται το καταστατικό. Ενημερώνεται η μερίδα με τη νέα διεύθυνση επικοινωνίας, αν το σύστημα τη χωρίζει από την έδρα. Αν στα εταιρικά έγγραφα κυκλοφορεί η παλαιά οδός ως έδρα, η ασφαλέστερη πράξη είναι πάντως η ρητή απόφαση.","links":[{"label":"Κάρτα πράξης","href":"/acts/edra"}]},"inside":{"outcome":"Αλλάζει ο δήμος, άρα τροποποιείται το άρθρο της έδρας. Στην Ε.Π.Ε. το έγγραφο είναι συμβολαιογραφικό. Στην Α.Ε. και στην Ι.Κ.Ε. όχι, εκτός αν συντρέχει άλλος λόγος συμβολαιογραφικού τύπου. Αρμόδια παραμένει η Υπηρεσία του Επιμελητηρίου Έβρου, εφόσον η νέα έδρα είναι στον νομό. Προθεσμία: είκοσι ημέρες.","links":[{"label":"Κάρτα πράξης","href":"/acts/edra"}]},"outside":{"outcome":"Η αρμοδιότητα ακολουθεί τη νέα έδρα. Η αίτηση δεν μένει μόνο στον Έβρο: μετέχει η Υπηρεσία αποχώρησης και η Υπηρεσία του επιμελητηρίου άφιξης. Το καταστατικό τροποποιείται. Έως την καταχώριση, πιστοποιητικά και κοινοποιήσεις βλέπουν την παλαιά έδρα.","links":[{"label":"Κάρτα πράξης","href":"/acts/edra"},{"label":"Περίπτωση: Αλεξανδρούπολη προς Αθήνα","href":"/cases/edra-athina"}]}}},"dioikisi":{"start":"who","nodes":{"who":{"question":"Τι ακριβώς αλλάζει;","options":[{"label":"Αντικατάσταση διαχειριστή ή μέλους διοίκησης","next":"replace"},{"label":"Παραίτηση, χωρίς νέο πρόσωπο","next":"resign"},{"label":"Μόνο ο τρόπος εκπροσώπησης","next":"mode"}]},"replace":{"question":"Το καταστατικό κατονομάζει το πρόσωπο του διαχειριστή;","options":[{"label":"Ναι","next":"named"},{"label":"Όχι, η εξουσία ανήκει στη συνέλευση","next":"unnamed"}]},"named":{"outcome":"Η συνέλευση των εταίρων αποφασίζει την αντικατάσταση και τροποποιεί το καταστατικό. Το πρακτικό ορίζει το νέο πρόσωπο, τον ΑΦΜ του και τον τρόπο εκπροσώπησης, όχι μόνο το όνομα. Αίτηση εντός είκοσι ημερών. Ο νέος δεν υποβάλλει άλλες πράξεις πριν η μερίδα τον δείξει.","links":[{"label":"Κάρτα πράξης","href":"/acts/dioikisi"}]},"unnamed":{"outcome":"Αρκεί απόφαση της συνέλευσης, χωρίς τροποποίηση καταστατικού, εφόσον το καταστατικό δεν κατονομάζει πρόσωπο. Και πάλι καταχωρίζεται ο τρόπος εκπροσώπησης. Αν το πρακτικό σιωπά ως προς το ποιος δεσμεύει την εταιρεία, η αίτηση επιστρέφεται.","links":[{"label":"Κάρτα πράξης","href":"/acts/dioikisi"}]},"resign":{"outcome":"Η παραίτηση καταχωρίζεται. Αν δεν ορίζεται διάδοχος, η εταιρεία κινδυνεύει να μείνει χωρίς νόμιμη διοίκηση. Πέραν των έξι μηνών αυτός είναι λόγος αναστολής καταχώρισης. Δείτε την περίπτωση παραίτησης διαχειριστή Ι.Κ.Ε. όταν δεν συγκαλείται συνέλευση.","links":[{"label":"Κάρτα πράξης","href":"/acts/dioikisi"},{"label":"Περίπτωση παραίτησης","href":"/cases/paraitisi-ike"}]},"mode":{"outcome":"Καταχωρίζεται νέος τρόπος δέσμευσης: μονομελώς, από κοινού ή με όριο ποσού. Αν ο τρόπος είναι άρθρο του καταστατικού, τροποποιείται και κωδικοποιείται. Η παλαιά εξουσία παύει έναντι τρίτων από την καταχώριση, όχι από την υπογραφή του πρακτικού.","links":[{"label":"Κάρτα πράξης","href":"/acts/dioikisi"}]}}},"meridia":{"start":"who","nodes":{"who":{"question":"Προς ποιον μεταβιβάζονται τα εταιρικά μερίδια;","options":[{"label":"Προς άλλον εταίρο","next":"between"},{"label":"Προς τρίτον, εκτός εταιρείας","next":"third"},{"label":"Προς κληρονόμο εταίρου που πέθανε","next":"heir"}]},"between":{"question":"Το καταστατικό επιβάλλει δικαίωμα προτίμησης και μεταξύ εταίρων;","options":[{"label":"Ναι, ή δεν το αποκλείει","next":"pref"},{"label":"Το αποκλείει ρητά για μεταβίβαση μεταξύ εταίρων","next":"free"}]},"pref":{"outcome":"Χρειάζεται συμφωνητικό με αριθμό μεριδίων και τίμημα, παραίτηση των λοιπών από το δικαίωμα προτίμησης για αυτή μόνο τη μεταβίβαση ή απόδειξη ότι τηρήθηκε, νέος πίνακας και κωδικοποίηση αν τα πρόσωπα είναι στο καταστατικό. Αίτηση εντός είκοσι ημερών. Τα ποσοστά αθροίζουν στο κεφάλαιο.","links":[{"label":"Κάρτα πράξης","href":"/acts/meridia"}]},"free":{"outcome":"Η μεταβίβαση μεταξύ εταίρων δεν σκοντάφτει στο δικαίωμα προτίμησης, επειδή το καταστατικό το αποκλείει ρητά. Μένει το συμφωνητικό, ο νέος πίνακας και η κωδικοποίηση όπου τα πρόσωπα γράφονται στο καταστατικό. Η αίτηση υποβάλλεται εντός είκοσι ημερών από τη συμφωνία.","links":[{"label":"Κάρτα πράξης","href":"/acts/meridia"}]},"third":{"outcome":"Μεταβίβαση προς τρίτον χωρίς μνεία του δικαιώματος προτίμησης επιστρέφεται. Επισυνάπτονται συμφωνητικό, παραίτηση ή τήρηση του δικαιώματος, νέος πίνακας και κωδικοποιημένο καταστατικό. Υπογράφει η καταχωρισμένη διοίκηση.","links":[{"label":"Κάρτα πράξης","href":"/acts/meridia"}]},"heir":{"outcome":"Ο κληρονόμος δεν γίνεται εταίρος επειδή κληρονομεί. Αν το καταστατικό συνεχίζει την εταιρεία, χρειάζεται χωριστή εισδοχή. Αλλιώς η οδός είναι λύση και εκκαθάριση. Η μερίδα δεν ενημερώνεται με ληξιαρχική πράξη θανάτου μόνο.","links":[{"label":"Κάρτα μεταβίβασης","href":"/acts/meridia"},{"label":"Περίπτωση θανάτου σε Ο.Ε.","href":"/cases/thanatos-oe"}]}}}},"cases":[{"id":"thanatos-oe","title":"Πέθανε εταίρος σε ομόρρυθμη εταιρεία","prompts":["πέθανε εταίρος","θανατος οε","κληρονομοι ομορρυθμη","απεβιωσε εταιρος"],"lead":"Ο θάνατος ομόρρυθμου εταίρου δεν είναι λογιστική εγγραφή. Είναι εταιρικό γεγονός, και η μερίδα πρέπει να πάψει να δείχνει τον θανόντα ως πρόσωπο που δεσμεύει την εταιρεία.","steps":["Ελέγχεται το καταστατικό: η εταιρεία συνεχίζεται με τους λοιπούς ή λύεται. Αν σιωπά, εφαρμόζεται ο ν. 4072/2012.","Αν συνεχίζεται, απόφαση των εναπομενόντων εταίρων, νέος πίνακας και, αν ο θανών ήταν διαχειριστής, νέος τρόπος εκπροσώπησης.","Αν λύεται, απόφαση λύσης, ορισμός εκκαθαριστή και, εντός έτους, ισολογισμός έναρξης εκκαθάρισης.","Ο κληρονόμος δεν γίνεται αυτοδικαίως ομόρρυθμος επειδή κληρονομεί. Η είσοδός του είναι χωριστή πράξη, με τη συναίνεση που απαιτεί ο νόμος και το καταστατικό.","Η διαγραφή του φυσικού προσώπου από το μητρώο, ως υπόχρεου, δεν συγχέεται με τη μεταβολή της εταιρικής μερίδας."],"actIds":["dioikisi","meridia","lysi","enarxi-ekkatharisis"]},{"id":"diarkeia","title":"Έληξε η διάρκεια, η εταιρεία όμως λειτουργεί","prompts":["εληξε η διαρκεια","ληξη διαρκειας","συνεχιζει να λειτουργει","παραταση διαρκειας"],"lead":"Η λήξη της διάρκειας είναι λόγος λύσης, όχι σιωπηρή παράταση. Η συνέχιση της δραστηριότητας δεν ανανεώνει το καταστατικό.","steps":["Αν οι εταίροι θέλουν συνέχεια, αποφασίζουν παράταση πριν ή μόλις διαπιστωθεί η λήξη, και τροποποιούν το άρθρο της διάρκειας.","Η αίτηση υποβάλλεται εντός είκοσι ημερών, με κωδικοποιημένο καταστατικό.","Αν δεν υπάρξει απόφαση παράτασης, η οδός είναι η λύση και η εκκαθάριση, όχι η ανοχή.","Πράξεις που υπογράφονται μετά τη λήξη, χωρίς καταχωρισμένη παράταση ή εκκαθαριστή, επιστρέφονται στον έλεγχο νομιμοποίησης."],"actIds":["katastatiko","lysi"]},{"id":"paraitisi-ike","title":"Ο διαχειριστής Ι.Κ.Ε. παραιτήθηκε και δεν συγκαλείται συνέλευση","prompts":["παραιτηση διαχειριστη ικε","δεν συγκαλειται συνελευση","χωρις διαχειριστη","παραίτηση διαχειριστή"],"lead":"Η παραίτηση καταχωρίζεται. Η εταιρεία δεν μένει νομίμως ακέφαλη επ’ αόριστον, ούτε ο παραιτηθείς συνεχίζει να υποβάλλει αιτήσεις.","steps":["Υποβάλλεται η παραίτηση, με την πράξη και την ημερομηνία της, ώστε η μερίδα να πάψει να τον δείχνει.","Κάθε εταίρος μπορεί να ζητήσει σύγκληση κατά τον ν. 4072/2012. Η αδράνεια των λοιπών δεν κρατά τον παραιτηθέντα σε καθήκοντα.","Αν περάσουν έξι μήνες χωρίς νόμιμη διοίκηση, η μερίδα τίθεται σε αναστολή καταχώρισης.","Έως τον ορισμό διαδόχου δεν υποβάλλονται άλλες αιτήσεις με την υπογραφή του παραιτηθέντος."],"actIds":["dioikisi"],"treeId":"dioikisi"},{"id":"edra-athina","title":"Αλλαγή έδρας από Αλεξανδρούπολη σε Αθήνα","prompts":["αλλαγη εδρας αθηνα","από αλεξανδρουπολη","μεταφορα εδρας","φευγει απο τον εβρο"],"lead":"Δεν είναι τοπική διόρθωση διεύθυνσης. Αλλάζει το αρμόδιο επιμελητήριο.","steps":["Απόφαση του αρμόδιου οργάνου και τροποποίηση του άρθρου της έδρας, με πλήρη νέα διεύθυνση.","Αίτηση στην Υπηρεσία του Έβρου και στην Υπηρεσία του επιμελητηρίου της νέας έδρας. Η μία δεν αρκεί.","Έως την καταχώριση, η μερίδα, τα πιστοποιητικά και η αρμοδιότητα μένουν στον Έβρο.","Αν η μερίδα είναι σε αναστολή, η μεταφορά δεν την παρακάμπτει. Πρώτα η εκκρεμής δημοσίευση."],"actIds":["edra"],"treeId":"edra"},{"id":"anastoli-kai-metra","title":"Θέλω μεταβολή, αλλά λείπει ο ισολογισμός","prompts":["αναστολη καταχωρισης","λειπει ισολογισμος","δεν με αφηνει να υποβαλω","εκκρεμει χρηση"],"lead":"Η αναστολή δεν παρακάμπτεται επειδή η νέα πράξη επείγει. Η μερίδα ανοίγει αφού καταχωριστεί ό,τι εκκρεμεί.","steps":["Εντοπίζεται ο λόγος: οικονομικές καταστάσεις, έλλειψη διοίκησης άνω των έξι μηνών, ισολογισμός έναρξης εκκαθάρισης, ΑΦΜ ή πιστοποίηση κεφαλαίου.","Υποβάλλεται μόνο η πράξη που λείπει. Νέα, άσχετη αίτηση δεν γίνεται δεκτή.","Αν οι εκκρεμότητες είναι περισσότερες, η αναστολή αίρεται με την τελευταία, όχι με την πρώτη.","Για ανενεργό ΑΦΜ η άρση έρχεται από την ΑΑΔΕ, όχι με πρακτικό προς το Επιμελητήριο."],"actIds":["oikonomikes","dioikisi","enarxi-ekkatharisis"]}],"atlas":[{"code":"ΙΚΕ-ΔΙΑΧ-07","title":"Ασυμφωνία απόφασης εταίρων και κωδικοποιημένου καταστατικού","actId":"dioikisi","forms":["ike","epe"],"finding":"Το πρακτικό ορίζει νέο διαχειριστή. Το συνημμένο καταστατικό εξακολουθεί να κατονομάζει τον προηγούμενο ή δεν περιέχει τον τρόπο εκπροσώπησης.","problem":"Ο έλεγχος δεν επιλέγει ποιο από τα δύο έγγραφα «εννοούσε» η εταιρεία. Δημοσιεύεται ένα σώμα.","fix":"Επανυποβάλλεται η αίτηση με πρακτικό και κωδικοποίηση που λένε το ίδιο πρόσωπο, τον ίδιο τρόπο και την ίδια ημερομηνία.","before":["Το ονοματεπώνυμο και ο ΑΦΜ ταυτίζονται στα δύο έγγραφα.","Ο τρόπος εκπροσώπησης είναι πρόταση, όχι σιωπή.","Η ημερομηνία πρακτικού και υπογραφών είναι μία."],"basis":"Άρθρο 25 ν. 4919/2022· ν. 4072/2012.","character":"Πρακτική επισήμανση"},{"code":"ΓΕΝ-ΗΜΕΡ-02","title":"Δύο ημερομηνίες στο ίδιο πρακτικό","actId":"katastatiko","forms":["ae","epe","ike","oe","ee"],"finding":"Η συνεδρίαση γράφει μία ημέρα και οι υπογραφές άλλη, ή το διαβιβαστικό του λογιστή τρίτη.","problem":"Η εικοσαήμερη προθεσμία δεν έχει αφετηρία. Η αίτηση δεν χαρακτηρίζεται ούτε εμπρόθεσμη ούτε εκπρόθεσμη.","fix":"Ενιαία χρονολογία: τόπος, ημερομηνία, ώρα, και ρητή μνεία ότι η απόφαση υπογράφεται αυθημερόν.","before":["Μία ημερομηνία σε πρακτικό, υπογραφές και αίτηση.","Αν η υπογραφή έγινε άλλη μέρα, αυτό γράφεται ως έχει και δεν εξωραΐζεται."],"basis":"Άρθρο 25 ν. 4919/2022· άρθρο 93 ν. 4548/2018 για πρακτικά διοικητικού συμβουλίου.","character":"Πρακτική επισήμανση"},{"code":"ΑΕ-ΕΚΠΡ-04","title":"Εκλογή χωρίς τρόπο δέσμευσης","actId":"dioikisi","forms":["ae"],"finding":"Καταχωρίζεται σύνθεση διοικητικού συμβουλίου. Δεν προκύπτει ποιος δεσμεύει την εταιρεία και αν μονομελώς.","problem":"Η μερίδα χρησιμεύει στον τρίτο για να γνωρίζει τον εκπρόσωπο. Κατάλογος μελών δεν είναι εκπροσώπηση.","fix":"Πρακτικό συγκρότησης σε σώμα, την ίδια ή την αμέσως επόμενη καταχωριστέα πράξη, με πρόεδρο, διευθύνοντα και τρόπο υπογραφής.","before":["Θητεία με έναρξη και λήξη.","Παύση της προηγούμενης εξουσίας, ρητά."],"basis":"Ν. 4548/2018, άρθρα 77 επ. και 93.","character":"Νομοθετική διάταξη"},{"code":"ΟΙΚ-ΣΧΕΔ-01","title":"Προσχέδιο καταστάσεων αντί εγκεκριμένου σώματος","actId":"oikonomikes","forms":["ae","epe","ike"],"finding":"Το συνημμένο είναι φύλλο εργασίας ή καταστάσεις με σύνολα διαφορετικά από το πρακτικό έγκρισης.","problem":"Δημοσιεύεται ό,τι ενέκρινε το όργανο. Το δοκίμιο δεν είναι πράξη της εταιρείας.","fix":"Πρακτικό που εγκρίνει συγκεκριμένη χρήση και συγκεκριμένα μεγέθη, και σώμα καταστάσεων που ταυτίζεται με αυτά.","before":["Η χρήση γράφεται ημερολογιακά.","Υπογράφει η καταχωρισμένη διοίκηση.","Αν υπάρχει έλεγχος, επισυνάπτεται η έκθεση."],"basis":"Άρθρα 25 και 29 ν. 4919/2022.","character":"Νομοθετική διάταξη"},{"code":"ΑΝΑΣΤ-ΧΡΗ-03","title":"Μεταβολή ενώ εκκρεμεί προηγούμενη χρήση","actId":"oikonomikes","forms":["ae","epe","ike","oe","ee"],"finding":"Ζητείται έδρα, διοίκηση ή μεταβίβαση. Η μερίδα δεν δέχεται νέα αίτηση.","problem":"Η παράλειψη δημοσίευσης οικονομικών καταστάσεων είναι λόγος αναστολής. Η αναστολή δεν είναι καθυστέρηση διεκπεραίωσης.","fix":"Καταχωρίζεται η εκκρεμής δημοσίευση. Η άρση είναι αυτόματη μετά την ολοκλήρωση όλων των εκκρεμοτήτων.","before":["Ελέγχεται και δεύτερη εκκρεμότητα: διοίκηση, ΑΦΜ, πιστοποίηση, ισολογισμός έναρξης.","Δεν ζητείται παράκαμψη με επιστολή."],"basis":"Άρθρο 29 ν. 4919/2022.","character":"Νομοθετική διάταξη"},{"code":"ΣΚΟΠ-ΚΑΔ-05","title":"Ο ΚΑΔ υποκαθιστά τον σκοπό","actId":"skopos","forms":["ae","epe","ike","oe","ee","astiki"],"finding":"Η αίτηση τροποποίησης σκοπού συνοδεύεται μόνο από βεβαίωση μεταβολής δραστηριοτήτων της ΑΑΔΕ.","problem":"Ο σκοπός είναι καταστατική ρήτρα. Ο ΚΑΔ είναι φορολογική ταξινόμηση.","fix":"Αυτολεξεί νέο εδάφιο στο πρακτικό και στο κωδικοποιημένο καταστατικό. Η δήλωση ΚΑΔ γίνεται στη ΔΟΥ, μέσα στα όρια του σκοπού.","before":["Το νέο εδάφιο δεν είναι γενική εμπορική εξουσία.","Δεν έμεινε σε ισχύ αντίθετη ρήτρα αποκλειστικότητας."],"basis":"Άρθρο 25 ν. 4919/2022.","character":"Πρακτική επισήμανση"},{"code":"ΚΕΦ-ΑΡΙΘ-06","title":"Αύξηση χωρίς νέο κεφάλαιο και ονομαστική αξία","actId":"kefalaio","forms":["ae","epe","ike"],"finding":"Η απόφαση αναφέρει μόνο το ποσό της αύξησης.","problem":"Η δημοσιευτέα απόφαση περιέχει το νέο κεφάλαιο, τον αριθμό, το είδος και την ονομαστική αξία.","fix":"Συμπληρώνεται η απόφαση. Δεν εξουσιοδοτείται η Υπηρεσία «να συμπληρώσει τα τυπικά».","before":["Το άθροισμα μεριδίων ισούται με το νέο κεφάλαιο.","Η πιστοποίηση δεν υποβάλλεται πριν από την καταχώριση της αύξησης."],"basis":"Ν. 4548/2018· ν. 4072/2012· άρθρο 29 ν. 4919/2022 για την πιστοποίηση.","character":"Νομοθετική διάταξη"},{"code":"ΜΕΡ-ΠΡΟΤ-08","title":"Μεταβίβαση χωρίς δικαίωμα προτίμησης","actId":"meridia","forms":["epe","ike"],"finding":"Ιδιωτικό συμφωνητικό προς τρίτον και αίτημα ενημέρωσης του πίνακα εταίρων.","problem":"Αν υπάρχει δικαίωμα προτίμησης, η παράλειψή του δεν είναι τυπικό έλλειμμα.","fix":"Παραίτηση των λοιπών εταίρων για τη συγκεκριμένη μεταβίβαση, ή απόδειξη ότι τηρήθηκε, συν νέος πίνακας και κωδικοποίηση όπου χρειάζεται.","before":["Τα ποσοστά αθροίζουν στο κεφάλαιο.","Η παραίτηση δεν είναι γενική για κάθε μελλοντική μεταβίβαση, εκτός αν αυτό αποφασίστηκε."],"basis":"Ν. 3190/1955· ν. 4072/2012.","character":"Νομοθετική διάταξη"},{"code":"ΛΥΣ-ΕΝΑΡ-09","title":"Λύση χωρίς ισολογισμό έναρξης επί ένα έτος","actId":"enarxi-ekkatharisis","forms":["ae","epe","ike","oe","ee"],"finding":"Η εταιρεία έχει λυθεί. Νέα αίτηση απορρίπτεται λόγω αναστολής.","problem":"Η παράλειψη ισολογισμού έναρξης εκκαθάρισης πέραν του έτους είναι αυτοτελής λόγος αναστολής.","fix":"Υποβάλλεται ο ισολογισμός έναρξης από τον ήδη καταχωρισμένο εκκαθαριστή, με αναφορά στην απόφαση λύσης. Δεν επαναϋποβάλλεται η λύση ως διορθωτικό.","before":["Ο εκκαθαριστής είναι το πρόσωπο της μερίδας.","Δεν χρησιμοποιείται το έντυπο των ετήσιων καταστάσεων."],"basis":"Άρθρο 29 ν. 4919/2022.","character":"Νομοθετική διάταξη"},{"code":"ΥΜΣ-ΔΙΠΛ-11","title":"Δεύτερη σύσταση αντί διόρθωσης σφάλματος","actId":"systasi","forms":["ae","epe","ike","oe","ee"],"finding":"Λάθος επωνυμία ή εκπρόσωπος στην ηλεκτρονική Υπηρεσία Μίας Στάσης. Ξεκινά νέα σύσταση.","problem":"Δημιουργείται δεύτερη μερίδα. Το σφάλμα της πρώτης παραμένει και μπορεί να επισύρει κύρωση του άρθρου 4 της ΚΥΑ.","fix":"Αίτηση διόρθωσης στην αρμόδια Υπηρεσία Γ.Ε.ΜΗ., με το σφάλμα, το ορθό στοιχείο και τη δήλωση υπαιτιότητας.","before":["Δεν δεσμεύεται νέα επωνυμία «διορθωμένη».","Δεν γίνεται δεύτερη έναρξη στη ΔΟΥ."],"basis":"ΚΥΑ 46982/2025, άρθρο 4.","character":"Κανονιστική πράξη"},{"code":"ΜΕΤ-ΤΡΟΠ-12","title":"Μετασχηματισμός ως τροποποίηση μορφής","actId":"metaschimatismos","forms":["ae","epe","ike","oe","ee"],"finding":"Ένα πρακτικό δηλώνει ότι η εταιρεία «μετατρέπεται» σε άλλη μορφή.","problem":"Συγχώνευση, διάσπαση και μετατροπή επέρχονται με την καταχώριση της ολοκλήρωσης κατά τον ν. 4601/2019.","fix":"Τηρείται η ακολουθία: σχέδιο και δημοσιότητά του, εκθέσεις, αποφάσεις οργάνων, σύμβαση όπου απαιτείται, αίτηση ολοκλήρωσης.","before":["Καμία από τις μετέχουσες μερίδες δεν είναι σε αναστολή.","Κάθε εταιρεία υποβάλλει στη δική της μερίδα."],"basis":"Ν. 4601/2019.","character":"Νομοθετική διάταξη"},{"code":"ΑΦΜ-ΑΝΑΣΤ-13","title":"Αναστολή λόγω ΑΦΜ","actId":"edra","forms":["ae","epe","ike","oe","ee"],"finding":"Η αίτηση δεν καταχωρίζεται και το πιστοποιητικό γράφει αναστολή, χωρίς έλλειψη πρακτικού.","problem":"Αναστολή ή απενεργοποίηση ΑΦΜ από την ΑΑΔΕ είναι λόγος του άρθρου 29. Δεν αίρεται με υπεύθυνη δήλωση προς το Επιμελητήριο.","fix":"Τακτοποίηση στην ΑΑΔΕ. Η άρση ακολουθεί την ενημέρωση του μητρώου.","before":["Δεν υποβάλλεται νέα εταιρική απόφαση για να «καλύψει» τον ΑΦΜ."],"basis":"Άρθρο 29 ν. 4919/2022.","character":"Νομοθετική διάταξη"}],"breaches":[{"id":"fs","label":"Μη δημοσίευση οικονομικών καταστάσεων","article":"άρθρο 10","base":"Ορισμένο ποσό κατά μέγεθος και υπηρεσία"},{"id":"late","label":"Εκπρόθεσμη υποβολή αίτησης","article":"άρθρο 7","base":"Ορισμένο ποσό κατά μορφή"},{"id":"omit","label":"Παράλειψη υποχρεωτικής πράξης","article":"άρθρο 9","base":"Ορισμένο ποσό κατά μορφή και μέγεθος"},{"id":"register","label":"Παράλειψη εγγραφής στο Γ.Ε.ΜΗ.","article":"άρθρο 5","base":"Ορισμένο ποσό κατά μορφή και υπηρεσία"},{"id":"papers","label":"Μη αναγραφή στοιχείων στα εταιρικά έγγραφα","article":"άρθρο 6","base":"Ορισμένο ποσό κατά μορφή"},{"id":"yms","label":"Λάθη στη σύσταση μέσω e-ΥΜΣ","article":"άρθρο 4","base":"Ορισμένο ποσό κατά μορφή"},{"id":"auto","label":"Λάθη σε αυτόματη καταχώριση","article":"άρθρο 8","base":"Ορισμένο ποσό κατά μορφή και μέγεθος"},{"id":"name","label":"Επωνυμία ή διακριτικός τίτλος","article":"άρθρο 11","base":"Ορισμένο ποσό κατά μορφή και μέγεθος"}],"sizes":[{"id":"micro","label":"Πολύ μικρή"},{"id":"small","label":"Μικρή"},{"id":"medium","label":"Μεσαία"},{"id":"large","label":"Μεγάλη ή εισηγμένη"}],"themes":[{"id":"oikonomikes","title":"Οικονομικές καταστάσεις","whom":"Α.Ε., Ε.Π.Ε., Ι.Κ.Ε., συνεταιρισμοί, υποκαταστήματα αλλοδαπής και προσωπικές εταιρείες μόνο όταν όλοι οι ομόρρυθμοι είναι νομικά πρόσωπα περιορισμένης ευθύνης.","deadline":"Είκοσι ημέρες από τη λήψη της απόφασης έγκρισης. Η συνέλευση, χωρίς παράταση, έως τη 10η ημέρα του ένατου μήνα. Συνεταιρισμοί: 20 Ιουλίου. Υποκαταστήματα αλλοδαπής των άρθρων 41 και 43 έως 45: 31 Δεκεμβρίο αφο ή με ιδιωτικό έγγραφο, αν υιοθετείται πρότυπο καταστατικό. Το έγγραφο είναι συμβολαιογραφικό και όταν εισφέρεται στοιχείο για το οποίο ο νόμος απαιτεί αυτόν τον τύπο, ιδίως ακίνητο (άρθρο 4 παρ. 2 ν. 4548/2018). Ελάχιστο κεφάλαιο 25.000 ευρώ, ολοσχερώς καταβεβλημένο κατά τη σύσταση (άρθρο 15). Ε.Π.Ε.: Σύσταση με συμβολαιογραφικό έγγραφο ή, χωρίς καμία παρέκκλιση, με πρότυπο καταστατικό (άρθρο 6 ν. 3190/1955, όπως ισχύει). Αν εισφέρεται στοιχείο για τη μεταβίβαση του οποίου απαιτείται συμβολαιογραφικός τύπος, δεν αρκεί απλό ιδιωτικό έγγραφο. Κάθε μεταγενέστερη τροποποίηση παραμένει συμβολαιογραφική. Ι.Κ.Ε.: Η εταιρική σύμβαση καταρτίζεται εγγράφως. Συμβολαιογραφικός τύπος απαιτείται όταν τον επιβάλλει ειδική διάταξη, όταν εισφέρεται στοιχείο για το οποίο ο νόμος τον απαιτεί, ή όταν τον επιλέγουν τα μέρη (άρθρο 43 ν. 4072/2012). Οι εισφορές διακρίνονται σε κεφαλαιακές, εξωκεφαλαιακές και εγγυητικές. Ο.Ε.: Ιδιωτικό συμφωνητικό, εκτός αν εισφέρεται στοιχείο που απαιτεί συμβολαιογραφικό τύπο. Η καταχώριση στο Γ.Ε.ΜΗ. είναι συστατική. Ε.Ε.: Όπως στην ομόρρυθμη. Στο συμφωνητικό διακρίνεται ποιος είναι ομόρρυθμος και ποιος ετερόρρυθμος, και έως ποιου ποσού ευθύνεται ο ετερόρρυθμος. Συνεταιρισμός: Καταστατικό κατά την ειδική νομοθεσία του συνεταιρισμού και καταχώριση στο Γ.Ε.ΜΗ. Δεν αντιγράφεται το κεφάλαιο της ανώνυμης."},{"q":"Προθεσμία","a":"Όπου η καταχώριση είναι συστατική, η εταιρεία δεν έχει νομική προσωπικότητα πριν από αυτήν. Η έναρξη στη ΔΟΥ δεν την υποκαθιστά."},{"q":"Αφετηρία προθεσμίας","a":"Υπογραφή καταστατικού ή συμφωνητικού."},{"q":"Αίτηση Γ.Ε.ΜΗ.","a":"Ηλεκτρονική Υπηρεσία Μίας Στάσης, όπου η μορφή το επιτρέπει. Αλλιώς, αίτηση στην Υπηρεσία Γ.Ε.ΜΗ. της έδρας."},{"q":"Απαιτούμενα δικαιολογητικά","a":"Καταστατικό ή ιδιωτικό συμφωνητικό, με σκοπό, έδρα, διάρκεια και κεφάλαιο · Στοιχεία ιδρυτών: ταυτότητα και ΑΦΜ · Διορισμός διοίκησης και ρητός τρόπος εκπροσώπησης · Δέσμευση επωνυμίας και, αν υπάρχει, διακριτικού τίτλου · Μνεία κεφαλαίου και της καταβολής τ  των εταίρων. Δεν απαιτείται συμβολαιογράφος, εκτός αν εισφέρεται στοιχείο που ο νόμος το επιβάλλει. Ε.Ε.: Όπως στην ομόρρυθμη: ιδιωτικό έγγραφο. Ο ετερόρρυθμος δεν διαχειρίζεται και ευθύνεται έως την εισφορά του. Συνεταιρισμός: Απόφαση της γενικής συνέλευσης κατά τον νόμο του συνεταιρισμού και το καταστατικό. Δεν αντιγράφεται ο τύπος της ανώνυμης ή της εταιρείας περιορισμένης ευθύνης."},{"q":"Προθεσμία","a":"Υποβολή εντός είκοσι ημερών από την απόφαση. Η τροποποίηση που δεν καταχωρίστηκε δεν αντιτάσσεται στους τρίτους."},{"q":"Αφετηρία προθεσμίας","a":"Ημερομηνία της απόφασης του οργάνου που έχει την αρμοδιότητα κατά το καταστατικό και τον νόμο."},{"q":"Αίτηση Γ.Ε.ΜΗ.","a":"Αίτηση στην Υπηρεσία Γ.Ε.ΜΗ. της έδρας, με έλεγχο νομιμότητας."},{"q":"Απαιτούμενα δικαιολογητικά","a":"Πρακτικό, με τόπο, ημερομηνία, ώρα και απαρτία ή πλειοψηφία · Το νέο κείμενο των άρθρων που αλλάζουν, αυτολεξεί · Κωδικοποιημένο καταστατικό · Υπογραφές όσων το πρακτικό δηλώνει ότι υπέγραψαν, αυθημερόν"},{"q":"Τέλος","a":"Τέλος καταχώρισης για κάθε αίτηση που ελέγχεται. Οι αυτόματες καταχωρίσεις δεν το φέρουν. Προαπαιτείται ενήμερο ετήσιο τέλος Γ.Ε.ΜΗ., που δεν ταυτίζεται με τη συνδρομή μέλους."},{"q":"Υπογραφές","a":"Υπογράφουν αυθημερόν όσοι το πρακτικό δηλώνει ότι παρέστησαν και αποφάσισαν. Στο σύστημα υποβάλλει καταχωρισμένος εκπρόσωπος, εκτός αν η ίδια η αίτηση είναι η μεταβολή της εκπροσώπησης."},{"q":"Απαιτείται τροποποίηση καταστατικού;","a":"Ναι. Η πράξη είναι η ίδια η τροποποίηση. Επισυνάπτεται κωδικοποιημένο σώμα."},{"q":"Έλεγχος νομιμότητας","a":"Ναι. Η Υπηρεσία Γ.Ε.ΜΗ. της έδρας ελέγχει τη νομιμότητα πριν από την καταχώριση."},{"q":"Συνήθη λάθη","a":"Η απόφαση ελήφθη από όργανο που δεν είχε την αρμοδιότητα. Το πρακτικό και το κωδικοποιημένο καταστατικό λένε διαφορετικά πράγματα. Η μερίδα τελεί σε αναστολή καταχώρισης."},{"q":"Συνέπειες καθυστέρησης","a":"Η τροποποίηση δεν έχει επέλθει έναντι των τρίτων. Εκπρόθεσμη αίτηση επισύρει κύρωση, χωριστά από το κύρος της απόφασης."},{"q": χώριση στο βιβλίο εταίρων και τη δημοσιότητα στο Γ.Ε.ΜΗ. (άρθρο 28 ν. 3190/1955, όπως ισχύει). Ι.Κ.Ε.: Ιδιωτικό έγγραφο (άρθρο 84 παρ. 1 ν. 4072/2012). Η μεταβίβαση εν ζωή ή αιτία θανάτου είναι κατ’ αρχήν ελεύθερη (άρθρο 83 παρ. 1). Το καταστατικό μπορεί να την περιορίσει, να τάξει δικαίωμα προτίμησης ή να απαιτήσει συναίνεση (άρθρο 84 παρ. 2). Μερίδια που αντιστοιχούν σε εξωκεφαλαιακή ή εγγυητική εισφορά η οποία δεν έχει εξοφληθεί δεν μεταβιβάζονται, έως την εξαγορά των υποχρεώσεων κατά το άρθρο 82 (άρθρο 83 παρ. 2). Κεφαλαιακή εισφορά είναι χρήμα ή εισφορά σε είδος (άρθρο 77). Εξωκεφαλαιακή είναι εργασία ή υπηρεσία που αποτιμάται στο καταστατικό (άρθρο 78). Εγγυητική είναι η ανάληψη ευθύνης έναντι τρίτων έως ορισμένο ποσό (άρθρο 79). Ο.Ε.: Δεν είναι μεταβίβαση μεριδίων κεφαλαιουχικής εταιρείας. Είναι είσοδος, έξοδος ή αντικατάσταση εταίρου, με τροποποίηση της εταιρικής σύμβασης και ιδιωτικό έγγραφο, εκτός αν εισφέρεται στοιχείο που απαιτεί συμβολαιογραφικό τύπο. Ο ομόρρυθμος ευθύνεται απεριόριστα και εις ολόκληρον. Ε.Ε.: Η μεταβολή ομόρρυθμου ή ετερόρρυθμου τροποποιεί την εταιρική σύμβαση. Ο ετερόρρυθμος ευθύνεται έως την εισφορά του και δεν γίνεται διαχειριστής. Ιδιωτικό έγγραφο, εκτός αν ο νόμος επιβάλλει συμβολαιογραφικό τύπο για το εισφερόμενο στοιχείο."},{"q":"Προθεσμία","a":"Υποβολή εντός είκοσι ημερών. Το δικαίωμα προτίμησης, όπου υπάρχει, πρέπει να έχει τηρηθεί ή να έχει παραιτηθεί πριν από την αίτηση."},{"q":"Αφετηρία προθεσμίας","a":"Ημερομηνία της συμφωνίας μεταβίβασης ή της απόφασης των εταίρων που την αποδέχεται."},{"q":"Αίτηση Γ.Ε.ΜΗ.","a":"Υπηρεσία Γ.Ε.ΜΗ. της έδρας, μαζί με την τροποποίηση του καταστατικού όπου τα στοιχεία των εταίρων είναι μέρος του."},{"q":"Απαιτούμενα δικαιολογητικά","a":"Συμφωνητικό μεταβίβασης με αριθμό μεριδίων και τίμημα · Παραίτηση από το δικαίωμα προτίμησης ή πρακτικό που βεβαιώνει ότι τηρήθηκε · Νέος πίνακας εταίρων και ποσοστών · Κωδικοποιημένο καταστατικό, αν αλλάζουν τα πρόσωπα που αναφέρει"},{"q":"Τέλος","a":"Τέλος κα έγκρισης, όχι από τη λήξη της χρήσης (άρθρο 25 παρ. 3). Η συνέλευση, χωρίς παράταση, συνέρχεται έως τη 10η ημέρα του ένατου μήνα από τη λήξη (10 Σεπτεμβρίου, αν η χρήση έληξε 31 Δεκεμβρίου). Αν η έγκριση γίνει εκείνη την ημέρα, η υποβολή λήγει στις 30 Σεπτεμβρίου. Η 30ή Σεπτεμβρίου δεν είναι αυτοτελής προθεσμία του Γ.Ε.ΜΗ. Αστικοί συνεταιρισμοί: 20 Ιουλίου του επόμενου έτους. Υποκαταστήματα αλλοδαπής των άρθρων 41 και 43 έως 45: 31 Δεκεμβρίου του επόμενου έτους. Η παράταση συνελεύσεων του 2026 και η ανακοίνωση για 31 Οκτωβρίου μένουν στη λωρίδα έτους, έως ότου δημοσιευθεί ΦΕΚ."},{"q":"Αφετηρία προθεσμίας","a":"Ημερομηνία έγκρισης από την τακτική συνέλευση ή το αρμόδιο όργανο. Όχι η καταληκτική ημερομηνία σύγκλησης."},{"q":"Αίτηση Γ.Ε.ΜΗ.","a":"Ηλεκτρονική αίτηση στην Υπηρεσία Γ.Ε.ΜΗ. της έδρας."},{"q":"Απαιτούμενα δικαιολογητικά","a":"Πρακτικό έγκρισης, με την χρήση στην οποία αφορά · Οι εγκεκριμένες καταστάσεις, όχι προσχέδιο λογιστή · Προσάρτημα και έκθεση διαχείρισης, όπου απαιτούνται · Έκθεση ελέγχου, αν ο έλεγχος είναι υποχρεωτικός ή αποφασίστηκε"},{"q":"Τέλος","a":"Τέλος καταχώρισης για κάθε αίτηση που ελέγχεται. Οι αυτόματες καταχωρίσεις δεν το φέρουν. Προαπαιτείται ενήμερο ετήσιο τέλος Γ.Ε.ΜΗ., που δεν ταυτίζεται με τη συνδρομή μέλους."},{"q":"Υπογραφές","a":"Υπογράφουν αυθημερόν όσοι το πρακτικό δηλώνει ότι παρέστησαν και αποφάσισαν. Στο σύστημα υποβάλλει καταχωρισμένος εκπρόσωπος, εκτός αν η ίδια η αίτηση είναι η μεταβολή της εκπροσώπησης."},{"q":"Απαιτείται τροποποίηση καταστατικού;","a":"Όχι. Οι καταστάσεις δεν τροποποιούν το καταστατικό."},{"q":"Έλεγχος νομιμότητας","a":"Ναι. Η Υπηρεσία Γ.Ε.ΜΗ. της έδρας ελέγχει τη νομιμότητα πριν από την καταχώριση."},{"q":"Συνήθη λάθη","a":"Η διοίκηση που υπογράφει δεν είναι η καταχωρισμένη. Εκκρεμεί προηγούμενη χρήση και η μερίδα είναι ήδη σε αναστολή. Υποβάλλονται ισολογισμός έναρξης ή πέρατος εκκαθάρισης με το έντυπο των ετήσιων καταστάσεων."},{"q":"Συνέπειες καθυστέρησης","a":"Λόγος αναστολής καταχώρισης. Κλείνει function esc(value) {
  return String(value ?? "").replace(/[&<>"]/g, (ch) => (
    ch === "&" ? "\u0026amp;" : ch === "<" ? "\u0026lt;" : ch === ">" ? "\u0026gt;" : "\u0026quot;"
  ));
}
function fold(value) {
  return String(value || "")
    .toLocaleLowerCase("el")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/ς/g, "σ");
}
function formBy(id) { return DATA.forms.find((f) => f.id === id); }

function greekDate(iso) {
  const [y, m, d] = String(iso || "").split("-").map(Number);
  if (!y || !m || !d) return iso || "—";
  return d + " " + MONTHS[m - 1] + " " + y;
}
function addDays(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
  const dd = String(dt.getUTCDate()).padStart(2, "0");
  return dt.getUTCFullYear() + "-" + mm + "-" + dd;
}
function addMonths(iso, months) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1 + months, 1));
  const last = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
  dt.setUTCDate(Math.min(d, last));
  const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
  const dd = String(dt.getUTCDate()).padStart(2, "0");
  return dt.getUTCFullYear() + "-" + mm + "-" + dd;
}
let memoryRoute = null;
function hashOk() {
  const p = location.protocol;
  return p === "http:" || p === "https:" || p === "file:";
}
function route() {
  const raw = memoryRoute !== null ? memoryRoute : (hashOk() ? (location.hash || "#/").slice(1) : "/");
  const q = raw.indexOf("?");
  const path = (q === -1 ? raw : raw.slice(0, q)) || "/";
  const params = new URLSearchParams(q === -1 ? "" : raw.slice(q + 1));
  const parts = path.split("/").filter(Boolean);
  return { parts, params, path: "/" + parts.join("/") };
}
function go(next) {
  let raw = String(next || "/");
  if (raw.startsWith("#")) raw = raw.slice(1);
  if (!raw.startsWith("/")) raw = "/" + raw;
  if (hashOk()) {
    memoryRoute = null;
    const target = "#" + raw;
    if (location.hash !== target) location.hash = target;
    else render();
    return;
  }
  memoryRoute = raw;
  render();
}

function saveJSON(key, value) {
