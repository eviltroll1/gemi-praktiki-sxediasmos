function checklistHTML(key, act) {
  const state = checks()[key] || {};
  const items = DATA.checklist.concat(act.documents.map((d) => ({ id: "doc-" + d.id, label: "Έγγραφο: " + d.label + (d.hint ? " — " + d.hint : "") })));
  const done = items.filter((item) => state[item.id] === "yes" || state[item.id] === "na").length;
  const nos = items.filter((item) => state[item.id] === "no").length;
  const lis = items.map((item) => {
    const v = state[item.id] || "";
    const btn = (val, label) => `<button type="button" class="btn dark" data-check="${esc(key)}" data-item="${esc(item.id)}" data-val="${val}" aria-pressed="${v === val}">${label}</button>`;
    return `<li><span>${esc(item.label)}</span><span class="check-actions">${btn("yes","Ναι")}${btn("no","Όχι")}${btn("na","Δεν αφορά")}</span></li>`;
  }).join("");
  return `<h2>Έλεγχος πριν από την υποβολή</h2>
    <p class="progress" id="progress">${done}/${items.length} σημεία κλεισμένα.${nos ? " " + nos + " χρειάζονται διόρθωση." : ""}</p>
    <ul class="checks">${lis}</ul>
    <p class="no-print"><button type="button" class="btn dark" id="print">Εκτύπωση ελέγχου</button></p>
    <p class="small muted">Ο έλεγχος μένει σε αυτή τη συσκευή. Δεν αποθηκεύεται επωνυμία, ΑΦΜ ή όνομα πελάτη.</p>`;
}

function expandQuery(q) {
  const f = fold(q);
  const pairs = [["διευθυν","εδρα"],["μετακομ","εδρα"],["παραιτ","διαχειρ"],["ισολογ","οικονομ"],["προστιμ","κυρωσ"],["μετοχ","μεριδ"],["κλεισιμ","λυση"],["καδ","σκοπ"],["συμβουλ","διοικ"]];
  const extra = pairs.filter(([a]) => f.includes(a)).map(([, b]) => b);
  return [f, ...extra];
}
function hit(needles, text) {
  const f = fold(text);
  return needles.some((n) => n && f.includes(n));
}
function searchHits(q) {
  const needles = expandQuery(q);
  const hits = [];
  for (const item of DATA.cases) {
    const blob = [item.title, item.lead, ...item.prompts, ...item.steps].join(" ");
    if (hit(needles, blob)) hits.push({ href: "#/periptosi/" + item.id, kicker: "Περίπτωση", title: item.title, text: item.lead, score: hit(needles, item.title) ? 5 : 3 });
  }
  for (const act of DATA.acts) {
    const blob = [act.title, act.deadline, act.trigger, act.sanction, act.channel, ...act.blockers, ...act.documents.map((d) => d.label), ...act.basis].join(" ");
    if (hit(needles, blob)) hits.push({ href: "#/karta/_/" + act.id, kicker: "Κάρτα πράξης", title: act.title, text: act.deadline, score: hit(needles, act.title) ? 4 : 2 });
  }
  for (const item of DATA.atlas) {
    const blob = [item.code, item.title, item.finding, item.fix].join(" ");
    if (hit(needles, blob)) hits.push({ href: "#/sfalma/" + encodeURIComponent(item.code), kicker: "Σφάλμα " + item.code, title: item.title, text: item.finding, score: 2 });
  }
  for (const item of DATA.themes) {
    if (hit(needles, [item.title, item.whom, item.deadline, item.changed].join(" "))) {
      hits.push({ href: "#/nomothesia/" + item.id, kicker: "Νομοθεσία", title: item.title, text: item.changed, score: 1 });
    }
  }
  hits.sort((a, b) => b.score - a.score);
  return hits;
}
function viewSearch(q) {
  const hits = q.trim().length >= 2 ? searchHits(q) : [];
  const list = !q ? "" : hits.length ? `<div class="list">${hits.map((h) => `<a href="${h.href}"><span class="muted">${esc(h.kicker)}</span><span></span><span><strong>${esc(h.title)}</strong><br><span class="small muted">${esc(h.text)}</span></span><span>→</span></a>`).join("")}</div>` : `<p class="callout warn">Δεν βρέθηκε εγκεκριμένη κάρτα για αυτή τη διατύπωση. Δοκιμάστε «έδρα», «διαχειριστής», «μερίδια» ή ανοίξτε τον <a href="#/periptoseis">Case Finder</a>. Η αναζήτηση δεν επινοεί κανόνα.</p>`;
  return `${searchBox(q)}<div class="section">${list}</div>`;
}

function mapHref(href) {
  if (href.startsWith("/acts/")) return "#/karta/_/" + href.slice(6);
  if (href.startsWith("/cases/")) return "#/periptosi/" + href.slice(7);
  return href;
}

function baseFine(breach, form, size, secretariat) {
  const capital = form === "ae" || form === "epe" || form === "ike";
  const personal = form === "oe" || form === "ee" || form === "astiki";
  const mid = form === "epe" || form === "ike" || form === "synetairismos" || form === "ypokatastima";
  const capitalSize = { micro: 320, small: 400, medium: 800, large: 1600 };
  const ggeSize = { micro: 400, small: 500, medium: 2000, large: 2000 };
  if (breach === "yms") {
    if (form === "ae") return 5000;
    if (form === "epe" || form === "ike" || form === "synetairismos") return 2000;
    if (personal) return 500;
    return null;
  }
  if (breach === "register") {
    if (secretariat) return form === "ypokatastima" ? 6000 : 10000;
    if (form === "ae") return 2000;
    if (mid) return 1200;
    if (personal) return 1000;
    return null;
  }
  if (breach === "papers" || breach === "late") {
    if (secretariat) return form === "ypokatastima" ? 300 : 500;
    if (form === "ae") return 200;
    if (mid) return 120;
    if (personal) return 100;
    return null;
  }
  if (breach === "auto" || breach === "omit" || breach === "name") {
    if (secretariat) return form === "ypokatastima" ? 400 : ggeSize[size];
    if (capital) return capitalSize[size];
    if (form === "synetairismos" || form === "ypokatastima") return 320;
    if (personal) return 200;
    return null;
  }
  if (breach === "fs") {
    if (form === "synetairismos") return null;
    if (secretariat) return form === "ypokatastima" ? 10000 : DATA.fsGge[size];
    if (form === "ypokatastima") return 1000;
    if (capital || personal) return DATA.fsChamber[size];
    return null;
  }
  return null;
}
function penaltyAmount(params) {
  const breach = params.get("breach") || "";
  const form = params.get("form") || "";
  if (!breach || !form) return null;
  const meta = DATA.breaches.find((b) => b.id === breach);
  if (!meta) return null;
  const size = params.get("size") || "micro";
  const secretariat = params.get("sec") === "1";
  const repeat = Number(params.get("repeat") || 0);
  const cured = params.get("cured") === "1";
  const liquidation = params.get("liq") === "1";
  const partners = params.get("partners") === "1";
  let blocked = "";
  let amount = baseFine(breach, form, size, secretariat);
  if (breach === "fs" && (form === "oe" || form === "ee") && !partners) {
    amount = null;
    blocked = "Ο.Ε. και Ε.Ε. δημοσιεύουν καταστάσεις μόνο όταν όλοι οι ομόρρυθμοι είναι νομικά πρόσωπα περιορισμένης ευθύνης.";
  }
  if (breach === "fs" && form === "synetairismos") blocked = "Ο πίνακας του άρθρου 10 για Επιμελητήριο δεν δίνει χωριστό ποσό συνεταιρισμού.";
  let factor = 1;
  if (repeat === 1) factor = 2;
  if (repeat === 2) factor = 3;
  if (liquidation) factor *= 0.5;
  if (cured) factor *= 0.5;
  return {
    meta, amount, factor, blocked,

  if (a === "periptoseis") return viewCaseFinder();
  if (a === "periptosi") return viewCase(b);
  if (a === "ergaleia") return viewTools();
  if (a === "dentro") return viewTree(b, c);
  if (a === "prothesmia") return viewDeadline(params);
  if (a === "prostimo") return viewPenalty(params);

function currentNav() {
  const a = route().parts[0] || "";
  if (!a) return "/";
  if (["prakseis", "morfi", "stadio", "karta"].includes(a)) return "/prakseis";
  if (["ergaleia", "dentro", "prothesmia", "prostimo", "sfalmata", "sfalma", "aporripsi", "periptoseis", "periptosi", "imerologio"].includes(a)) return "/ergaleia";
  if (a === "allages") return "/allages";
  if (a === "nomothesia") return "/nomothesia";
  if (a === "paratiritirio") return "/paratiritirio";
  return "/";
}

function wire() {
  const find = document.getElementById("find");
  if (find) find.onsubmit = (e) => {
    e.preventDefault();
    const q = new FormData(find).get("q");
    go("/anazitisi?q=" + encodeURIComponent(String(q || "")));
  };
  const calc = document.getElementById("calc");
  if (calc) calc.onsubmit = (e) => {
    e.preventDefault();
    go("/prothesmia?" + new URLSearchParams(new FormData(calc)).toString());
  };
  const pen = document.getElementById("pen");
  if (pen) pen.onsubmit = (e) => {
    e.preventDefault();
    go("/prostimo?" + new URLSearchParams(new FormData(pen)).toString());
  };
  document.querySelectorAll("[data-check]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.getAttribute("data-check");
      const item = btn.getAttribute("data-item");
      const val = btn.getAttribute("data-val");
      const all = checks();
      all[key] = all[key] || {};
      all[key][item] = all[key][item] === val ? "" : val;
      saveJSON("gemi-checks", all);
      render();
    });
  });
  const save = document.getElementById("save");
  if (save) save.onclick = () => {
    const key = save.getAttribute("data-key");
    const set = savedSet();
    if (set.has(key)) set.delete(key); else set.add(key);
    saveJSON("gemi-saved", [...set]);
    render();
  };
  const print = document.getElementById("print");
  if (print) print.onclick = () => window.print();
  document.querySelectorAll("[data-watch]").forEach((box) => {
    box.addEventListener("change", () => {
      const set = watched();
      const id = box.getAttribute("data-watch");
      if (box.checked) set.add(id); else set.delete(id);
      saveJSON("gemi-watch", [...set]);
    });
  });
  const form = document.getElementById("form");
  const act = document.getElementById("act");
  if (form && act && document.getElementById("calc")) {
    form.addEventListener("change", () => {
      const allowed = form.value ? DATA.acts.filter((a) => a.forms.includes(form.value)) : DATA.acts;
      const current = act.value;
      act.innerHTML = allowed.map((a) => `<option value="${esc(a.id)}">${esc(a.title)}</option>`).join("");
      if (allowed.some((a) => a.id === current)) act.value = current;
    });
  }
}

function render() {
  document.getElementById("app").innerHTML = shell(currentNav(), view());
  wire();
  const h = document.querySelector("main h1");
  if (h) h.setAttribute("tabindex", "-1");
}
document.addEventListener("click", (event) => {
  const link = event.target.closest("a");
  if (!link) return;
  const href = link.getAttribute("href") || "";
